<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OCR Physics Revision Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: graph-paper header, instrument-style readouts, one content column that widens to two on desktop.
   Colour: cool paper + ink navy, cobalt accent; amber/green/red reserved for status. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#E3E9F1; --ink:#0F1B30; --ink2:#4B5972; --line:#C9D3E0;
  --accent:#2447D8; --accent-ink:#FFFFFF; --accent-soft:#DAE3FF; --good:#0E8A5E; --warn:#B26A00; --bad:#C23A3A;
  --good-soft:#D6F1E5; --warn-soft:#FBE8C8; --bad-soft:#F9DADA; --grid:rgba(15,27,48,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#131D31; --surface2:#1B2740; --ink:#E8EEF8; --ink2:#9CABC4; --line:#2B3B59;
  --accent:#86A2FF; --accent-ink:#0B1220; --accent-soft:#1F2E5E; --good:#3DD598; --warn:#F0B04A; --bad:#FF8080;
  --good-soft:#103A2C; --warn-soft:#3F2F10; --bad-soft:#4A1E1E; --grid:rgba(232,238,248,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#131D31; --surface2:#1B2740; --ink:#E8EEF8; --ink2:#9CABC4; --line:#2B3B59;
  --accent:#86A2FF; --accent-ink:#0B1220; --accent-soft:#1F2E5E; --good:#3DD598; --warn:#F0B04A; --bad:#FF8080;
  --good-soft:#103A2C; --warn-soft:#3F2F10; --bad-soft:#4A1E1E; --grid:rgba(232,238,248,.05); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800} h3{font-size:1.1rem;font-weight:800} h4{font-size:.95rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sup{font-size:.78rem}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand b{font:800 1.15rem var(--f-display);letter-spacing:-.02em}
.brand span{font:500 .72rem var(--f-mono);color:var(--ink2)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 7px;font-weight:600;color:var(--ink2);white-space:nowrap}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .badge{font:500 .7rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 6px;margin-left:5px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.flat{background:transparent}
.card h3+*{margin-top:8px}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.85rem}

/* readout */
.readout{font:500 2.6rem/1 var(--f-mono);letter-spacing:-.03em}
.readout small{font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-left:6px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end}
.hero>div{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:.82rem;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dots{display:inline-flex;gap:4px}
.dots button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);padding:0}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots.c1 button.on{background:var(--bad);border-color:var(--bad)} .dots.c2 button.on{background:var(--warn);border-color:var(--warn)} .dots.c3 button.on{background:var(--warn);border-color:var(--warn)}
.dots.c4 button.on,.dots.c5 button.on{background:var(--good);border-color:var(--good)}

/* topics */
.mod{display:flex;flex-direction:column;gap:8px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.topic-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:12px 14px;align-items:center}
.topic-h .t{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;background:none;border:0;padding:0}
.topic-h .t b{font-family:var(--f-display);font-size:1.02rem}
.topic-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.topic-b{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.topic-b ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.eq{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:6px;font-size:.88rem}
.eq dt{color:var(--ink2)} .eq dd{margin:0;font-family:var(--f-mono);font-size:.84rem}
.pit{background:var(--warn-soft);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:.88rem}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.mode{display:flex;flex-direction:column;gap:10px}
.mode p{flex:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:4px 12px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.checks input{margin-top:3px;flex:none}
.sess{max-width:760px;margin:0 auto}
.sess-card{display:flex;flex-direction:column;gap:14px}
.qtext{font-size:1.05rem;line-height:1.6}
.answer{background:var(--surface2);border-radius:6px;padding:12px 14px}
.ms{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.ms label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ms input{margin-top:4px;flex:none}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}
.grades button small{font:400 .72rem var(--f-mono);color:var(--ink2)}
.grades button:hover{border-color:var(--accent)}
.fig-box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.fig{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
.fig text{font:11px var(--f-mono);fill:var(--ink2)}
.fig .tk{fill:var(--ink)}
.fig .ax{stroke:var(--ink);fill:none;stroke-width:1.4}
.fig .gr{stroke:var(--line);stroke-width:.6}
.fig .c1{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linejoin:round}
.fig .c2{stroke:var(--warn);fill:none;stroke-width:2;stroke-dasharray:6 3}
.fig .c3{stroke:var(--bad);fill:none;stroke-width:2}
.fig .ink{stroke:var(--ink);fill:none;stroke-width:1.5}
.fig .inkf{fill:var(--ink);stroke:none}
.fig .fill{fill:var(--accent-soft);stroke:none}
.fig .accf{fill:var(--accent);stroke:none}
.fig .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.fig .thin{stroke:var(--ink2);stroke-width:1;fill:none}
.fig .dash{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3;fill:none}
.fig .lbl{fill:var(--ink)}
.fig .lblA{fill:var(--accent)}
.timer{font:500 1rem var(--f-mono)}
.timer.over{color:var(--bad)}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent)}
kbd{font:500 .72rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* progress */
.tb{width:100%;border-collapse:collapse;font-size:.88rem}
.tb th,.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tw{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);display:block;position:relative}
.heat i b{position:absolute;inset:0;background:var(--accent);border-radius:3px}
.fc{display:flex;align-items:flex-end;gap:4px;height:90px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.fc i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.fc span{font:400 .62rem var(--f-mono);color:var(--ink2)}
.agenda{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font:500 .8rem var(--f-mono)}
.day .d b{display:block;font:800 1rem var(--f-display)}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:20px;color:var(--ink2);text-align:center}
.note{font-size:.85rem;color:var(--ink2)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:.88rem}
@media (max-width:520px){
  .readout{font-size:2.1rem}
  .topic-h{grid-template-columns:1fr}
  .topic-ctl{justify-content:flex-start}
  .day{grid-template-columns:62px minmax(0,1fr)}
}

/* ---- motion ---- */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes drawln{to{stroke-dashoffset:0}}
@keyframes wavemove{to{transform:translateX(-24px)}}
@keyframes ring{from{stroke-dashoffset:264}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes flash{from{box-shadow:0 0 0 0 var(--accent)}to{box-shadow:0 0 0 12px transparent}}
.logo{display:flex;align-items:center;gap:10px;color:var(--accent)}
.logo b{color:var(--ink)}
.logo svg{overflow:hidden;flex:none}
.logo .wave path{animation:wavemove 2.4s linear infinite}
.anim .card,.anim .topic,.anim .empty,.anim .mod-h{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
.anim .bar>i,.anim .prog>i{transform-origin:left;animation:grow .9s cubic-bezier(.2,.7,.2,1) both .2s}
.anim .fc i{transform-origin:bottom;animation:pop .6s both .2s}
.anim .heat i b{animation:pop .5s both .3s}
.sess-card.slide{animation:slidein .34s cubic-bezier(.2,.7,.2,1) both}
.answer{animation:pop .3s cubic-bezier(.2,.7,.2,1) both}
.grades button,.ms li,.opts button{animation:rise .32s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
.pit{animation:pop .35s both .1s}
.fig .draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:drawln 1s cubic-bezier(.3,.6,.2,1) forwards .15s}
.btn,.seg button,.dots button,.nav button,.grades button,.opts button,.mode{transition:transform .12s ease,background-color .2s,border-color .2s,box-shadow .2s,filter .2s}
.btn:active,.grades button:active,.opts button:active{transform:scale(.97)}
.btn:not([disabled]):hover{box-shadow:0 4px 14px -6px var(--accent)}
.mode:hover{transform:translateY(-3px);box-shadow:0 10px 24px -14px var(--ink)}
.topic{transition:box-shadow .2s,border-color .2s}
.topic:hover{border-color:var(--accent)}
.topic-b{animation:pop .3s both}
.dots button{transition:transform .15s,background-color .2s}
.dots button:hover{transform:scale(1.25)}
.nav button{transition:color .2s,border-color .25s}
.bar>i,.prog>i{transition:width .6s cubic-bezier(.2,.7,.2,1)}
/* multiple choice */
.opts{display:grid;gap:8px}
.opts button{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);font-size:1rem}
.opts button b{font:500 .8rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 7px;color:var(--ink2);flex:none;margin-top:2px}
.opts button:not([disabled]):hover{border-color:var(--accent);background:var(--accent-soft)}
.opts button.right{border-color:var(--good);background:var(--good-soft);animation:flash .6s}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft);animation:shake .35s}
.opts button[disabled]{cursor:default}
.opts button:not(.right):not(.wrong)[disabled]{opacity:.55}
/* ring */
.ringbox{position:relative;width:110px;height:110px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:9}
.ringbox .rbg{stroke:var(--surface2)}
.ringbox .rfg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:264;animation:ring 1.1s cubic-bezier(.3,.6,.2,1) both .2s}
.ringbox .rfg.good{stroke:var(--good)} .ringbox .rfg.warn{stroke:var(--warn)} .ringbox .rfg.bad{stroke:var(--bad)}
.ringbox span{position:absolute;inset:0;display:grid;place-items:center;font:500 1.5rem var(--f-mono)}
.chip.ext{background:var(--warn-soft);color:var(--warn);border-color:transparent}
details.model{border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--surface)}
details.model summary{cursor:pointer;font-weight:600}
details.model .answer{margin-top:8px}
.hint{font-size:.78rem;color:var(--good);font-family:var(--f-mono);white-space:nowrap}

/* ---- friendlier skin ---- */
:root{--m1:#64748B;--m2:#0E9F9A;--m3:#3257F0;--m4:#D9800B;--m5:#7C5CE6;--m6:#D8407A;--sun:#F5A524;--coral:#F2604F;--mint:#10A878;
  --ha:#2447D8;--hb:#1C86E0;--hc:#12AE9C;--blob1:rgba(36,71,216,.14);--blob2:rgba(18,174,156,.13);--r:16px;
  --shadow:0 1px 2px rgba(15,27,48,.05),0 10px 26px -14px rgba(15,27,48,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m1:#94A3B8;--m2:#2DD4BF;--m3:#7C9BFF;--m4:#F5A524;--m5:#A78BFA;--m6:#F472B6;--sun:#FBBF24;--coral:#FB7185;--mint:#34D399;
  --ha:#2A3FA8;--hb:#1B6BB8;--hc:#0E8F7E;--blob1:rgba(124,155,255,.12);--blob2:rgba(45,212,191,.09);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--m1:#94A3B8;--m2:#2DD4BF;--m3:#7C9BFF;--m4:#F5A524;--m5:#A78BFA;--m6:#F472B6;--sun:#FBBF24;--coral:#FB7185;--mint:#34D399;
  --ha:#2A3FA8;--hb:#1B6BB8;--hc:#0E8F7E;--blob1:rgba(124,155,255,.12);--blob2:rgba(45,212,191,.09);--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}
body{font-size:16px;background-color:var(--bg);background-image:radial-gradient(48rem 26rem at 92% -6%,var(--blob1),transparent 62%),radial-gradient(44rem 24rem at -8% 26%,var(--blob2),transparent 62%);background-attachment:fixed}
.card,.topic{border-radius:var(--r);box-shadow:var(--shadow);border-color:transparent}
.card.flat{box-shadow:none}
.btn{border-radius:999px;padding:9px 18px}
.btn.sm{padding:5px 13px}
.btn.big{padding:13px 26px;font-size:1.05rem;background:var(--sun);border-color:var(--sun);color:#2a1a00;box-shadow:0 8px 20px -8px var(--sun)}
.btn.glass{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(4px)}
.btn.glass:hover{background:rgba(255,255,255,.28)}
.seg,.chip,.fchip{border-radius:999px}
.seg button{padding:6px 12px}
.top{box-shadow:0 6px 20px -16px var(--ink)}
.nav{gap:4px;padding-bottom:8px}
.nav button{border:0;border-radius:999px;padding:7px 14px;font-weight:600}
.nav button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.nav button:not([aria-current="true"]):hover{background:var(--surface2)}
.nav .badge{background:var(--coral);color:#fff}
.nav button[aria-current="true"] .badge{background:#fff;color:var(--accent)}
.brand .hdr{display:flex;align-items:center;gap:6px}
.lvl{display:grid;grid-template-columns:auto auto;gap:0 8px;align-items:center;border:0;background:var(--surface2);border-radius:999px;padding:5px 12px 7px;position:relative;overflow:hidden}
.lvl:hover{background:var(--accent-soft)}

/* toasts, floaty, confetti */
#toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:60;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:16px;box-shadow:0 14px 30px -12px rgba(0,0,0,.55);font-size:.92rem;animation:toastin .45s cubic-bezier(.3,1.5,.5,1) both;max-width:100%}
.toast small{opacity:.8}
.toast.out{animation:toastout .35s ease both}
.toast svg{width:34px;height:34px;flex:none}
.toast.fire svg{width:26px;height:26px}

@keyframes toastin{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(10px) scale(.96)}}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:12px}
.bd{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px 4px;border-radius:14px;transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.bd:hover{transform:translateY(-4px) rotate(-2deg)}
.bd .bdg{width:58px;height:58px}
.bd .bdg.on{filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.bd b{font-size:.82rem}.bd small{font-size:.7rem;color:var(--ink2);line-height:1.3}
.bd:not(.on){opacity:.7}
.ringbox .rfg{stroke:url(#none)}
.ringbox .rfg{stroke:var(--accent)}
.ringbox .rfg.good{stroke:var(--good)}.ringbox .rfg.warn{stroke:var(--warn)}.ringbox .rfg.bad{stroke:var(--bad)}
