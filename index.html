 ["Define amplitude, period and frequency.","Amplitude: maximum displacement from equilibrium. Period: time for one complete oscillation. Frequency: number of oscillations per second (f = 1/T)."]],
[
 {m:4,cw:"Explain",q:"Explain why the suspension of a car is designed to be critically damped.",
  ms:["Damping removes energy from the oscillation, reducing the amplitude","Critical damping returns the system to equilibrium in the shortest possible time","Without oscillating, so the car does not keep bouncing after a bump","Under-damping would cause continued oscillation and over-damping would be slow to return to normal"],tip:"Compare with light and heavy damping."},
 {m:6,cw:"Describe",q:"Describe an experiment to investigate how the period of oscillation of a mass on a vertical spring depends on the mass, and explain how the spring constant is determined.",
  ms:["Hang a spring from a clamp and attach a known mass; measure the mass with a balance","Displace the mass a small distance and release it, keeping the amplitude small and constant","Time 20 oscillations from the centre of the motion, repeat and take a mean to find T","Repeat with a range of masses (at least six)","Plot T² against m: T² = 4π²m/k, so a straight line","Gradient = 4π²/k, so k = 4π²/gradient"],

[

[

 {m:6,cw:"Explain",q:"Explain why electrical energy is transmitted at high voltage and how a transformer changes the voltage, including reasons why it is not 100% efficient.",
  ms:["For a given power P = VI, a higher voltage means a lower current","Power lost in the cables is I²R, so a lower current greatly reduces wasted power","A step-up transformer raises the voltage at the power station and a step-down transformer lowers it for use","An alternating current in the primary coil produces a changing magnetic flux in the iron core","The flux links the secondary coil, inducing an emf (Faraday's law), with Vs/Vp = Ns/Np","Energy is lost through resistance of the coils, eddy currents in the core (reduced by laminations), hysteresis and flux leakage"],

const DEFS='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker></defs>';
function svg(W,H,inner,alt){return `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${alt||'Diagram'}">${DEFS}${inner}</svg>`}
const nf=v=>String(+(+v).toFixed(3));
function graph(o){
  const W=o.W||380,H=o.H||240,l=52,r=16,t=14,b=44;
  const X=v=>l+(v-o.x[0])/(o.x[1]-o.x[0])*(W-l-r), Y=v=>H-b-(v-o.y[0])/(o.y[1]-o.y[0])*(H-t-b);
  let s='';
  for(let v=o.x[0];v<=o.x[1]+1e-9;v+=o.x[2]){v=+v.toFixed(6);s+=`<line class="gr" x1="${X(v)}" y1="${t}" x2="${X(v)}" y2="${H-b}"/>`+(o.nox?'':`<text x="${X(v)}" y="${H-b+14}" text-anchor="middle" class="tk">${nf(v)}</text>`)}
  for(let v=o.y[0];v<=o.y[1]+1e-9;v+=o.y[2]){v=+v.toFixed(6);s+=`<line class="gr" x1="${l}" y1="${Y(v)}" x2="${W-r}" y2="${Y(v)}"/>`+(o.noy?'':`<text x="${l-6}" y="${Y(v)+4}" text-anchor="end" class="tk">${nf(v)}</text>`)}
  const x0=o.x[0]<0&&o.x[1]>0?X(0):l, y0=o.y[0]<0&&o.y[1]>0?Y(0):H-b;
  s+=`<path class="ax" d="M${x0} ${t} V${H-b}M${l} ${y0} H${W-r}"/>`;
  s+=`<text x="${(l+W-r)/2}" y="${H-6}" text-anchor="middle">${o.x[3]||''}</text>`;
  s+=`<text transform="translate(12 ${(t+H-b)/2}) rotate(-90)" text-anchor="middle">${o.y[3]||''}</text>`;
  s+=o.body(X,Y);
  return svg(W,H,s,o.alt);
}
const pl=(pts,X,Y,cls)=>`<polyline class="${cls||'c1'}" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
const curve=(f,a,b,n,X,Y,cls)=>{const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return pl(p,X,Y,cls)};

function nextState(r0,g,topic){
  const r=Object.assign({ease:2.5,int:0,reps:0,lapses:0,n:0},r0||{});

  else{
    if(r.reps===0)r.int=g===3?4:1;
    else if(r.reps===1)r.int=g===1?2:g===2?3:6;
    else{const b=Math.max(1,r.int);r.int=Math.round(g===1?b*1.2:g===2?b*r.ease:b*r.ease*1.35);if(r.int<=b)r.int=b+1}

function buildPlan(span){
  const t0=today();const up=S.tests.filter(x=>diffDays(t0,x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const map={};up.forEach(te=>te.topics.forEach(tp=>{if(!map[tp])map[tp]=te.date}));
  let L=Object.keys(map).map(id=>({id,date:map[id],m:mastery(id)})).sort((a,b)=>a.date.localeCompare(b.date)||a.m-b.m);
  if(!L.length){L=TOPICS.filter(x=>tget(x.id).status>=1).map(x=>({id:x.id,date:null,m:mastery(x.id)})).sort((a,b)=>a.m-b.m)}
  const W=[];[1,.6,.35].forEach((th,k)=>L.forEach(x=>{if(k===0||x.m<th)W.push(x)}));
  const days=[];let ptr=0;
  for(let i=0;i<span;i++){
    const d=addDays(t0,i);const tests=up.filter(x=>x.date===d);const tasks=[];
    const dueThen=ITEMS.filter(it=>{const r=S.sr[it.id];return r&&r.due<=d&&(i>0||true)}).length;
    if(i===0||dueThen)tasks.push({k:'rev',t:i===0?`Clear today's scheduled reviews (${dueItems().length} due)`:`Scheduled reviews (about ${dueThen} items by then)`});
    const left=x=>diffDays(d,x);
    const active=W.filter(x=>x.date===null||left(x.date)>=0);
    const nextT=up.find(x=>diffDays(d,x.date)>=0);
    const dt=nextT?diffDays(d,nextT.date):null;
    if(tests.length){tasks.push({k:'test',t:`Test day: ${tests.map(x=>esc(x.name)).join(', ')}. Skim your equation list, then trust your preparation.`})}
    else if(dt===1)tasks.push({k:'light',t:`Light retrieval only: flashcards on ${esc(nextT.name)} topics. Stop early and sleep well.`});
    else if(dt===2)tasks.push({k:'fix',t:`Fix the gaps from your mini-paper: redo missed mark points for ${esc(nextT.name)}.`});
    else if(dt===3)tasks.push({k:'paper',t:`Timed mini-paper (exam practice) on ${esc(nextT.name)} topics.`});
    else if(active.length){
      const pickd=[];let guard=0;
      while(pickd.length<Math.min(2,new Set(active.map(x=>x.id)).size)&&guard++<20){const c=active[ptr%active.length];ptr++;if(!pickd.find(p=>p.id===c.id))pickd.push(c)}
      pickd.forEach(c=>{const tp=TB[c.id],st=tget(c.id).status;
        tasks.push(st===0?{k:'learn',t:`Learn and write notes: ${tp.ref} ${tp.title}`,id:c.id}
          :c.m<.5?{k:'weak',t:`Retrieval and exam questions: ${tp.ref} ${tp.title} (needs work)`,id:c.id}
          :{k:'mix',t:`Mixed retrieval: ${tp.ref} ${tp.title}`,id:c.id})});
    }
    days.push({d,tasks,tests});
  }
  return days;
}

const CWHINT={Explain:'Give reasons. Link each point with because, so or therefore (cause, effect, consequence).',Describe:'Say what happens or how it is done, in order. You do not need to give reasons.',Calculate:'Write the equation, substitute with units, then give the answer with a unit and sensible significant figures.',Determine:'Use the data or graph to find the value and show how you did it.','Show that':'Work to the value given. Show every step and quote your answer to more significant figures than the question.',Evaluate:'Give points for and against, then a justified conclusion.',Compare:'Make a point about both things each time (similarity or difference).',Suggest:'Apply what you know to the new situation and give a reason.',Estimate:'State sensible values and assumptions, then calculate to one significant figure.',Identify:'Name each item clearly and say why.'};
const STOP=new Set(['which','their','there','would','where','being','these','those','about','because','other','after','before','should','could','while','using','under','every','between','through']);
function kwHit(point,draft){
  if(!draft||draft.length<15)return false;
  const d=draft.toLowerCase();
  const w=(point.replace(/<[^>]+>/g,'').toLowerCase().match(/[a-zα-ω]{5,}|\d+(?:\.\d+)?/g)||[]).filter(x=>!STOP.has(x));
  if(w.length<2)return false;
  return w.filter(x=>d.includes(x)).length/w.length>=.5;
}

}

}

function vProgress(){

  const avg=learned.length?learned.reduce((a,x)=>a+mastery(x.id),0)/learned.length:0;

function forecast(){
  const t=today();const a=[];let max=1;
  for(let i=0;i<14;i++){const d=addDays(t,i);const n=ITEMS.filter(it=>{const r=S.sr[it.id];return r&&(i===0?r.due<=d:r.due===d)}).length;max=Math.max(max,n);a.push([d,n])}

}
function heat(){
  const t=today();const start=addDays(t,-(12*7-1)-parseD(t).getDay());let max=1;const cells=[];
  for(let i=0;i<13*7;i++){const d=addDays(start,i);if(d>t){cells.push(null);continue}const n=(S.days[d]||{}).rev||0;max=Math.max(max,n);cells.push([d,n])}

}

function parseNum(s){
  s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/(?:×|x|\*)10\^?(-?\d+)/i,'e$1').replace(/,/g,'');
  const v=Number(s);return s===''?NaN:v;
}
function buildDrill(topics,type,n){
  let pool=ITEMS.filter(i=>topics.includes(i.topic)&&(type==='all'||i.type===type));
  return interleave(rankFor(pool).slice(0,n));
}
function buildExam(topics,marks){
  const pool=rankFor(ITEMS.filter(i=>i.type==='q'&&topics.includes(i.topic)));
  const out=[];let got=0;for(const q of pool){if(got>=marks)break;out.push(q);got+=q.m}
  return {queue:shuf(out),total:got};
}
function recordCalc(it,ok){
  const t=today();const day=S.days[t]||(S.days[t]={n:0,rev:0});day.rev=(day.rev||0)+1;
  const c=S.calc[it.topic]||(S.calc[it.topic]={n:0,ok:0});c.n++;if(ok)c.ok++;
  S.log.push({d:t,i:'calc-'+it.topic,tp:it.topic,ty:'calc',s:ok?1:0,g:ok?2:0});if(S.log.length>3000)S.log=S.log.slice(-3000);save();
}

function fcSVG(days){
  const W=380,H=200,l=46,r=14,t=14,b=38,X=d=>l+d/30*(W-l-r),Y=v=>t+(1-v)*(H-t-b);
  const none=[],pr=[];for(let d=0;d<=30;d+=.5)none.push([d,Math.exp(-d/2)]);
  let st=2,last=0,i=0;const rv=[...days].sort((x,y)=>x-y);
  for(let d=0;d<=30.001;d+=.25){if(i<rv.length&&d>=rv[i]-1e-9){pr.push([d,Math.exp(-(d-last)/st)]);st*=2.4;last=d;i++;pr.push([d,1])}pr.push([d,Math.exp(-(d-last)/st)])}
  const P=a=>a.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join(' ');
  let s='';[0,.5,1].forEach(v=>s+=`<line class="gr" x1="${l}" y1="${Y(v)}" x2="${W-r}" y2="${Y(v)}"/><text x="${l-6}" y="${Y(v)+4}" text-anchor="end" class="tk">${v*100}%</text>`);
  for(let d=0;d<=30;d+=5)s+=`<text x="${X(d)}" y="${H-b+14}" text-anchor="middle" class="tk">${d}</text>`;
  s+=`<path class="ax" d="M${l} ${t}V${H-b}H${W-r}"/><text x="${(l+W-r)/2}" y="${H-6}" text-anchor="middle">days since first learning</text>`;
  s+=`<polyline class="c2" points="${P(none)}"/><polyline class="c1" points="${P(pr)}"/>`+days.map(d=>`<circle class="accf" cx="${X(d)}" cy="${Y(1)}" r="4"/>`).join('');
  return {svg:svg(W,H,s,'Forgetting curve with and without reviews'),a:Math.round(pr[pr.length-1][1]*100),b:Math.round(none[none.length-1][1]*100)};
}
function fcBox(days){const f=fcSVG(days);return `<div class="fig-box">${f.svg}</div><p class="note" style="margin-top:8px">Memory at day 30: <b>${f.a}%</b> with ${days.length} spaced review${days.length===1?'':'s'} (solid line) against <b>${f.b}%</b> with none (dashed). A simple model, but the shape is real: each well-timed recall makes the memory last longer.</p>`}
const _vGuide=vGuide;
vGuide=function(){
  const extra=`<div class="grid2"><div class="card"><h3>See spacing in action</h3><p class="note">Switch reviews on and off and watch the forgetting curve change.</p>
   <div class="row" style="margin:10px 0">${[1,3,7,14,21].map(d=>`<label class="fchip pill"><input type="checkbox" data-chg="fcdemo" value="${d}" ${[1,3,7].includes(d)?'checked':''}> Day ${d}</label>`).join('')}</div><div id="fcbox">${fcBox([1,3,7])}</div></div>
   <div class="card"><h3>Make it yours</h3><div class="stack" style="gap:12px;margin-top:8px"><label class="f">Your name<input type="text" id="p-name" data-chg="pname" value="${esc(S.settings.name||'')}" maxlength="24" placeholder="What should Atom call you?"></label>
   <label class="f">Daily goal (reviews)<select id="p-goal" data-chg="pgoal">${[10,15,20,30,40,60].map(n=>`<option ${(S.settings.goal||20)===n?'selected':''}>${n}</option>`).join('')}</select></label>
   <label class="chk"><input type="checkbox" data-chg="psound" ${S.settings.sound?'checked':''}> Sound effects (quiet blips on answers and level-ups)</label>
   <p class="note">Meet <b>Atom</b>, your revision buddy, on the Today tab. Tap Atom for a physics fact.</p></div></div></div>`;
  return _vGuide().replace(/<\/div>$/,extra+'</div>');
};

/* ----- actions and events ----- */
Object.assign(ACT,{
  fact(){const el=$('#bubtxt');UI.fi=((UI.fi==null?-1:UI.fi)+1+Math.floor(Math.random()*3))%FACTS.length;
    if(el){el.textContent=FACTS[UI.fi];const b=el.closest('.bubble');if(b){b.classList.remove('swap');void b.offsetWidth;b.classList.add('swap')}}
    const m=$('.mascot');if(m){m.classList.remove('bounce');void m.getBoundingClientRect();m.classList.add('bounce')}},
  quickmcq(){const l=TOPICS.filter(x=>tget(x.id).status>=1).map(x=>x.id);const tp=l.length?l:TOPICS.map(x=>x.id);startSess('drill',buildDrill(tp,'mcq',10))},
  tfilter(b){UI.tf=b.dataset.v;$$('.fchip[data-act=tfilter]').forEach(c=>c.setAttribute('aria-pressed',c===b));applyTopicFilter()},
  sound(){S.settings.sound=!S.settings.sound;save();decorate();if(S.settings.sound)blip(SND.good)},
  theme(){S.settings.theme=isDark()?'light':'dark';save();applyTheme();decorate();if($('.fig'))render()}
});
const _status=ACT.status;
ACT.status=function(b){const r=b.getBoundingClientRect(),v=+b.dataset.v,id=b.dataset.id,was=tget(id).status;_status(b);
  if(v>=1&&was===0)toast(`<span><b>${TB[id].title.split(' and ')[0]}</b> added. ${itemsOf(id).length} items will join your reviews.</span>`);
  if(v===2&&was!==2)confetti(40,{x:r.left+r.width/2,y:r.top+r.height/2});unlock()};
const _modall=ACT.modall;ACT.modall=function(b){_modall(b);if(+b.dataset.v===2){toast(`<span><b>Module ${b.dataset.m}</b> marked as learned.</span>`);confetti(50,{x:b.getBoundingClientRect().left+30,y:b.getBoundingClientRect().top})}unlock()};
const _addtest=ACT.addtest;ACT.addtest=function(){const n=S.tests.length;_addtest();if(S.tests.length>n){toast(`<span><b>Test added.</b> Review intervals for its topics are now capped to fit before the date.</span>`);confetti(40,UI.last);unlock()}};
document.addEventListener('input',e=>{if(e.target.id==='tsearch')applyTopicFilter()});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.chg;if(!c)return;
  if(c==='fcdemo'){const d=$$('[data-chg=fcdemo]:checked').map(x=>+x.value);$('#fcbox').innerHTML=fcBox(d)}
  else if(c==='pname'){S.settings.name=e.target.value.trim();save()}
  else if(c==='pgoal'){S.settings.goal=+e.target.value;save()}
  else if(c==='psound'){S.settings.sound=e.target.checked;save();decorate();if(S.settings.sound)blip(SND.good)}
});
applyTheme();
render(true);
</script>

</body></html>
