<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>OCR Physics Revision Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: graph-paper header, instrument-style readouts, one content column that widens to two on desktop.
   Colour: cool paper + ink navy, cobalt accent; amber/green/red reserved for status. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --surface2:#E3E9F1; --ink:#0F1B30; --ink2:#4B5972; --line:#C9D3E0;
  --accent:#2447D8; --accent-ink:#FFFFFF; --accent-soft:#DAE3FF; --good:#0E8A5E; --warn:#B26A00; --bad:#C23A3A;
  --good-soft:#D6F1E5; --warn-soft:#FBE8C8; --bad-soft:#F9DADA; --grid:rgba(15,27,48,.06);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#131D31; --surface2:#1B2740; --ink:#E8EEF8; --ink2:#9CABC4; --line:#2B3B59;
  --accent:#86A2FF; --accent-ink:#0B1220; --accent-soft:#1F2E5E; --good:#3DD598; --warn:#F0B04A; --bad:#FF8080;
  --good-soft:#103A2C; --warn-soft:#3F2F10; --bad-soft:#4A1E1E; --grid:rgba(232,238,248,.05); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#131D31; --surface2:#1B2740; --ink:#E8EEF8; --ink2:#9CABC4; --line:#2B3B59;
  --accent:#86A2FF; --accent-ink:#0B1220; --accent-soft:#1F2E5E; --good:#3DD598; --warn:#F0B04A; --bad:#FF8080;
  --good-soft:#103A2C; --warn-soft:#3F2F10; --bad-soft:#4A1E1E; --grid:rgba(232,238,248,.05); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);padding-inline:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.5rem;font-weight:800} h3{font-size:1.1rem;font-weight:800} h4{font-size:.95rem;font-weight:600}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sup{font-size:.78rem}
.muted{color:var(--ink2)}
.small{font-size:.85rem}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.brand b{font:800 1.15rem var(--f-display);letter-spacing:-.02em}
.brand span{font:500 .72rem var(--f-mono);color:var(--ink2)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin-inline:-4px}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 7px;font-weight:600;color:var(--ink2);white-space:nowrap}
.nav button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .badge{font:500 .7rem var(--f-mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:1px 6px;margin-left:5px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sp{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card.flat{background:transparent}
.card h3+*{margin-top:8px}

/* buttons */
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);border-radius:6px;padding:8px 14px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:2px 7px;background:var(--surface2);color:var(--ink2);white-space:nowrap}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:90px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.85rem}

/* readout */
.readout{font:500 2.6rem/1 var(--f-mono);letter-spacing:-.03em}
.readout small{font-size:.8rem;color:var(--ink2);letter-spacing:0;margin-left:6px}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;align-items:end}
.hero>div{display:flex;flex-direction:column;gap:6px}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:5px 10px;font-size:.82rem;font-weight:500;color:var(--ink2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.dots{display:inline-flex;gap:4px}
.dots button{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);padding:0}
.dots button.on{background:var(--ink);border-color:var(--ink)}
.dots.c1 button.on{background:var(--bad);border-color:var(--bad)} .dots.c2 button.on{background:var(--warn);border-color:var(--warn)} .dots.c3 button.on{background:var(--warn);border-color:var(--warn)}
.dots.c4 button.on,.dots.c5 button.on{background:var(--good);border-color:var(--good)}

/* topics */
.mod{display:flex;flex-direction:column;gap:8px}
.mod-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding-top:8px}
.topic{background:var(--surface);border:1px solid var(--line);border-radius:8px;min-width:0}
.topic-h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 14px;padding:12px 14px;align-items:center}
.topic-h .t{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;background:none;border:0;padding:0}
.topic-h .t b{font-family:var(--f-display);font-size:1.02rem}
.topic-ctl{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.topic-b{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.topic-b ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.eq{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin-top:6px;font-size:.88rem}
.eq dt{color:var(--ink2)} .eq dd{margin:0;font-family:var(--f-mono);font-size:.84rem}
.pit{background:var(--warn-soft);border-radius:6px;padding:8px 10px;margin-top:6px;font-size:.88rem}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.mode{display:flex;flex-direction:column;gap:10px}
.mode p{flex:1}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:4px 12px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;cursor:pointer}
.checks input{margin-top:3px;flex:none}
.sess{max-width:760px;margin:0 auto}
.sess-card{display:flex;flex-direction:column;gap:14px}
.qtext{font-size:1.05rem;line-height:1.6}
.answer{background:var(--surface2);border-radius:6px;padding:12px 14px}
.ms{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.ms label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.ms input{margin-top:4px;flex:none}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-weight:600}
.grades button small{font:400 .72rem var(--f-mono);color:var(--ink2)}
.grades button:hover{border-color:var(--accent)}
.fig-box{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px;overflow-x:auto}
.fig{width:100%;max-width:460px;height:auto;display:block;margin:0 auto}
.fig text{font:11px var(--f-mono);fill:var(--ink2)}
.fig .tk{fill:var(--ink)}
.fig .ax{stroke:var(--ink);fill:none;stroke-width:1.4}
.fig .gr{stroke:var(--line);stroke-width:.6}
.fig .c1{stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linejoin:round}
.fig .c2{stroke:var(--warn);fill:none;stroke-width:2;stroke-dasharray:6 3}
.fig .c3{stroke:var(--bad);fill:none;stroke-width:2}
.fig .ink{stroke:var(--ink);fill:none;stroke-width:1.5}
.fig .inkf{fill:var(--ink);stroke:none}
.fig .fill{fill:var(--accent-soft);stroke:none}
.fig .accf{fill:var(--accent);stroke:none}
.fig .box{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.fig .thin{stroke:var(--ink2);stroke-width:1;fill:none}
.fig .dash{stroke:var(--ink2);stroke-width:1;stroke-dasharray:4 3;fill:none}
.fig .lbl{fill:var(--ink)}
.fig .lblA{fill:var(--accent)}
.timer{font:500 1rem var(--f-mono)}
.timer.over{color:var(--bad)}
.prog{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--accent)}
kbd{font:500 .72rem var(--f-mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

/* progress */
.tb{width:100%;border-collapse:collapse;font-size:.88rem}
.tb th,.tb td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tb th{font:500 .72rem var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tw{overflow-x:auto}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,14px);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);display:block;position:relative}
.heat i b{position:absolute;inset:0;background:var(--accent);border-radius:3px}
.fc{display:flex;align-items:flex-end;gap:4px;height:90px}
.fc div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;height:100%;min-width:0}
.fc i{display:block;width:100%;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.fc span{font:400 .62rem var(--f-mono);color:var(--ink2)}
.agenda{display:flex;flex-direction:column;gap:8px}
.day{display:grid;grid-template-columns:78px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day .d{font:500 .8rem var(--f-mono)}
.day .d b{display:block;font:800 1rem var(--f-display)}
.day ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.empty{border:1.5px dashed var(--line);border-radius:8px;padding:20px;color:var(--ink2);text-align:center}
.note{font-size:.85rem;color:var(--ink2)}
.warnbox{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:10px 12px;font-size:.88rem}
@media (max-width:520px){
  .readout{font-size:2.1rem}
  .topic-h{grid-template-columns:1fr}
  .topic-ctl{justify-content:flex-start}
  .day{grid-template-columns:62px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top"><div class="top-in">
  <div class="brand"><b>OCR Physics Revision Lab</b><span class="mono">H556 · A Level Physics A</span></div>
  <nav class="nav" id="nav" aria-label="Sections"></nav>
</div></header>
<main class="wrap" id="view"></main>
<script>
/* ---------- Specification data (paraphrased from OCR A H556; check the official spec for exact wording) ---------- */
const MODULES={
 1:"Module 1 · Development of practical skills",
 2:"Module 2 · Foundations of physics",
 3:"Module 3 · Forces and motion",
 4:"Module 4 · Electrons, waves and photons",
 5:"Module 5 · Newtonian world and astrophysics",
 6:"Module 6 · Particles and medical physics"};
const PAPERS={
 1:"Paper 1 (Modelling physics)", 2:"Paper 2 (Exploring physics)", 3:"Paper 3 (Unified physics)"};
const MOD_PAPERS={1:[1,2,3],2:[1,2,3],3:[1,3],4:[2,3],5:[1,3],6:[2,3]};
const TOPICS=[];
function T(id,mod,ref,title,o){TOPICS.push(Object.assign({id,mod,ref,title,pts:[],eq:[],tips:[],cards:[],qs:[]},o))}

T("prac",1,"1.1–1.2","Practical skills and uncertainty in practice",{
 pts:["Plan experiments: identify independent, dependent and control variables, and choose apparatus with a suitable resolution and range.",
  "Implement safely, recording readings to a consistent number of decimal places with units and column headings.",
  "Analyse with graphs: choose scales, plot, draw a line of best fit, find gradient and intercept, and link them to the equation.",
  "Evaluate: identify random and systematic errors, estimate uncertainties and suggest realistic improvements.",
  "Practical Endorsement is reported separately from the written papers, but practical skills are examined in all three papers."],
 eq:[["% uncertainty","(absolute uncertainty ÷ measured value) × 100%"],["Mean value","sum of repeats ÷ number of repeats"],["Uncertainty in a repeat mean","half the range of the repeats"]],
 tips:["Quote a gradient to the same number of significant figures as the least precise data.","'Improve the experiment' answers need a specific change and the reason it helps."],
 cards:[
  ["Difference between random and systematic error?","Random: scatter about the true value, unpredictable, reduced by repeating and averaging. Systematic: every reading shifted the same way (for example a zero error), NOT reduced by repeats; fix by calibrating or correcting."],
  ["Accuracy, precision and resolution: define each.","Accuracy: closeness to the true value. Precision: closeness of repeated readings to each other. Resolution: smallest change the instrument can detect."],
  ["Why plot a graph instead of calculating from a single pair of readings?","The gradient averages many readings, anomalies are visible, and a non-zero intercept can reveal a systematic error."],
  ["How do you reduce the effect of human reaction time when timing?","Time many oscillations or a long interval so the fixed reaction-time uncertainty is a smaller percentage; use light gates or a data logger; repeat and average."],
  ["How is the uncertainty in a gradient found?","Draw the best-fit line and a worst acceptable line (steepest or shallowest line that still passes through all the error bars). Uncertainty = difference between best and worst gradients."]],
 qs:[
  {m:3,cw:"Explain",q:"A student times one oscillation of a pendulum with a stopwatch and finds the percentage uncertainty in the period is too large. Explain how the student can reduce the percentage uncertainty in the period.",
   ms:["Time a large number of oscillations (for example 20) rather than one","Divide the total time by the number of oscillations to get the period, so the fixed reaction-time uncertainty becomes a much smaller percentage of the measured time","Repeat the timing and take the mean (or time from a fiducial marker at the centre of the swing)"],
   tip:"The absolute timing uncertainty (about 0.2 s of reaction time) stays about the same, so a longer total time makes the percentage smaller."},
  {m:3,cw:"Explain",q:"A graph of a student's results should pass through the origin but has a positive y-intercept. Suggest what type of error this indicates, give one possible cause and state how it can be removed.",
   ms:["Systematic error (all readings shifted by the same amount)","Cause such as a zero error on an instrument, or a constant offset in the set-up","Remove by checking the zero before use / correcting each reading, or by using the gradient (not a single point) in the analysis"],
   tip:"Random errors cause scatter. A consistent offset is systematic."}]});

T("units",2,"2.1","Physical quantities and units",{
 pts:["Use SI base units: kg, m, s, A, K, mol.","Derive units of derived quantities (N, J, W, Pa, V, Ω) in base units.","Check an equation is homogeneous by comparing the base units of each term.","Use prefixes from pico (10⁻¹²) to tera (10¹²) and convert between them.","Make reasoned estimates of quantities and give orders of magnitude."],
 eq:[["Newton","N = kg m s⁻²"],["Joule","J = kg m² s⁻²"],["Watt","W = kg m² s⁻³"],["Pascal","Pa = kg m⁻¹ s⁻²"],["Volt","V = kg m² s⁻³ A⁻¹"],["Ohm","Ω = kg m² s⁻³ A⁻²"]],
 tips:["Homogeneous does not mean correct. Dimensionless constants such as ½ or 2π cannot be checked this way."],
 cards:[
  ["Express the newton in SI base units.","kg m s⁻² (force = mass × acceleration)."],
  ["Express the volt in SI base units.","V = W/Q = J/(A s) = kg m² s⁻² / (A s) = kg m² s⁻³ A⁻¹."],
  ["Values of the prefixes p, n, μ, m, k, M, G, T.","10⁻¹², 10⁻⁹, 10⁻⁶, 10⁻³, 10³, 10⁶, 10⁹, 10¹²."],
  ["What does it mean if an equation is homogeneous?","Every term has the same base units. This is necessary for the equation to be correct but is not sufficient."],
  ["Express the pascal in base units.","Pa = N m⁻² = kg m s⁻² / m² = kg m⁻¹ s⁻²."]],
 qs:[
  {m:3,cw:"Show that",q:"Show that the SI base units of pressure are kg m⁻¹ s⁻².",
   ms:["Pressure = force ÷ area","Force = mass × acceleration, so the unit is kg m s⁻²","Area has unit m², so pressure = kg m s⁻² ÷ m² = kg m⁻¹ s⁻²"],tip:"Always start from the defining equation."},
  {m:4,cw:"Show that",q:"The speed v of a wave on a stretched string is given by v = √(T/μ), where T is the tension in the string and μ is its mass per unit length. Show that the equation is homogeneous.",
   ms:["T has base units kg m s⁻²","μ has base units kg m⁻¹","T/μ = m² s⁻²","√(T/μ) = m s⁻¹ which is the unit of speed, so the equation is homogeneous"],tip:"Do the square root as the last step."}]});

T("meas",2,"2.2","Making measurements and analysing data",{
 pts:["Absolute, fractional and percentage uncertainties.","Combine uncertainties: add absolute for sums and differences, add percentages for products and quotients, multiply the percentage by the power for powers.","Use error bars, best-fit lines and worst-acceptable lines.","Determine gradients and intercepts, and the uncertainty in a gradient.","Distinguish accuracy, precision, resolution, random and systematic errors."],
 eq:[["Percentage uncertainty","Δx/x × 100%"],["A + B or A − B","absolute uncertainties add"],["A × B or A ÷ B","percentage uncertainties add"],["Aⁿ","% uncertainty = n × % uncertainty in A"]],
 tips:["Do not add percentages for a sum or difference. Convert back to absolute uncertainties first."],
 cards:[
  ["How are uncertainties combined when adding or subtracting measurements?","Add the absolute uncertainties."],
  ["How are uncertainties combined when multiplying or dividing?","Add the percentage (or fractional) uncertainties."],
  ["The radius of a sphere is measured with a 2% uncertainty. What is the % uncertainty in its volume (V ∝ r³)?","3 × 2% = 6%."],
  ["Why draw error bars on a graph?","They show the uncertainty in each point, allow worst-acceptable lines to be drawn, and show whether the data are consistent with a given relationship (for example a line through the origin)."],
  ["A micrometer reads 0.02 mm with the jaws closed. What type of error is this?","A systematic (zero) error, which should be subtracted from every reading."]],
 qs:[
  {m:3,cw:"Calculate",q:"The diameter d of a wire is measured as 0.50 ± 0.01 mm. The cross-sectional area is A = πd²/4. Calculate (i) the percentage uncertainty in d, (ii) the percentage uncertainty in A and (iii) the value of A with its absolute uncertainty.",
   ms:["% uncertainty in d = 0.01/0.50 × 100 = 2%","% uncertainty in A = 2 × 2% = 4%","A = 1.96 × 10⁻⁷ m² with absolute uncertainty ± 0.08 × 10⁻⁷ m² (±8 × 10⁻⁹ m²)"],tip:"A depends on d², so the percentage doubles."},
  {m:3,cw:"Describe",q:"A student plots a graph with error bars and wants the best value for the gradient and its uncertainty. Describe how the student does this using the graph shown.",fig:["errbar"],
   ms:["Draw a best-fit line through the points (balanced about the points, passing within the error bars) and find its gradient using a large triangle","Draw the steepest and shallowest lines that still pass through all the error bars","Uncertainty in gradient = difference between the best gradient and the worst gradient (or half the range of the two worst gradients)"],tip:"State that the worst lines must pass through all the error bars."}]});

T("vec",2,"2.3","Nature of quantities: scalars and vectors",{
 pts:["Distinguish scalar quantities (magnitude only) from vector quantities (magnitude and direction).","Add vectors using scale drawings or by calculation (triangle or parallelogram method).","Resolve a vector into two perpendicular components.","Use resolution and addition for forces, velocities and displacements."],
 eq:[["Components","Fₓ = F cosθ ; F_y = F sinθ"],["Resultant (perpendicular vectors)","R = √(Fₓ² + F_y²)"],["Direction","tanθ = F_y / Fₓ"]],
 tips:["Say which line the angle is measured from. A bare angle with no reference scores poorly."],
 cards:[
  ["Define scalar and vector, with one example of each.","Scalar: magnitude only (e.g. energy, speed). Vector: magnitude and direction (e.g. force, velocity)."],
  ["A 50 N force acts 30° above the horizontal. State the horizontal and vertical components.","Horizontal 50 cos30° = 43 N; vertical 50 sin30° = 25 N."],
  ["Forces of 6.0 N and 8.0 N act at right angles. Find the resultant.","10 N, at tan⁻¹(6/8) = 37° to the 8.0 N force."],
  ["Which are vectors: momentum, kinetic energy, acceleration, power?","Momentum and acceleration are vectors; kinetic energy and power are scalars."]],
 qs:[
  {m:3,cw:"Calculate",q:"Two forces of 12 N and 5.0 N act at right angles on an object as shown. Calculate the magnitude and direction of the resultant force.",fig:["vecadd"],
   ms:["Resultant = √(12² + 5.0²) = 13 N","Angle: tanθ = 5.0/12","θ = 23° (22.6°) to the 12 N force"],tip:"Give the direction relative to a named force."},
  {m:4,cw:"Calculate",q:"A boat heads directly across a river at 2.0 m s⁻¹ relative to the water. The river flows at 1.5 m s⁻¹ and is 40 m wide. Calculate (i) the resultant speed of the boat relative to the bank and (ii) how far downstream the boat lands.",
   ms:["Resultant speed = √(2.0² + 1.5²) = 2.5 m s⁻¹","Time to cross = 40 / 2.0 = 20 s","Downstream distance = 1.5 × 20","= 30 m"],tip:"Treat the two perpendicular motions independently."}]});

T("mot",3,"3.1","Motion",{
 pts:["Displacement, speed, velocity and acceleration; distance–time, displacement–time, velocity–time and acceleration–time graphs.","Gradients and areas under motion graphs.","Equations for constant acceleration (suvat) in a straight line.","Free fall and determining g.","Projectile motion: independent horizontal and vertical components.","Stopping distance = thinking distance + braking distance."],
 eq:[["Final speed","v = u + at"],["Displacement","s = ut + ½at²"],["No time","v² = u² + 2as"],["Average velocity","s = ½(u + v)t"]],
 tips:["Choose a positive direction first and keep to it (up is positive, so g = −9.81 m s⁻²).","suvat only works for constant acceleration."],
 cards:[
  ["What do the gradient and area of a velocity–time graph represent?","Gradient = acceleration; area under the graph = displacement."],
  ["What does the gradient of a displacement–time graph represent?","Velocity (instantaneous velocity is the gradient of the tangent)."],
  ["Describe the horizontal and vertical motion of a projectile (no air resistance).","Horizontal: constant velocity (v cosθ). Vertical: constant acceleration g downwards, initial velocity v sinθ."],
  ["If the speed of a car doubles, what happens to thinking and braking distance?","Thinking distance doubles (constant reaction time); braking distance quadruples (v² = 2as)."],
  ["State the conditions needed to use the suvat equations.","Constant acceleration in a straight line."]],
 qs:[
  {m:4,cw:"Calculate",q:"The velocity–time graph for a car is shown. Calculate (i) the acceleration during the first 8.0 s, (ii) the total distance travelled and (iii) the average speed for the whole journey.",fig:["vt",{pts:[[0,0],[8,20],[20,20],[25,0]]}],
   ms:["a = 20/8.0 = 2.5 m s⁻²","Distance = area under graph: ½ × 8.0 × 20 + 20 × 12 + ½ × 5.0 × 20","= 80 + 240 + 50 = 370 m","Average speed = 370 / 25 = 15 m s⁻¹ (14.8)"],tip:"Split the area into a triangle, a rectangle and a triangle."},
  {m:5,cw:"Calculate",q:"A footballer kicks a ball from level ground with an initial speed of 18 m s⁻¹ at 35° above the horizontal. Ignore air resistance. Calculate the time of flight and the horizontal range.",fig:["proj",{v:18,th:35}],
   ms:["Vertical component = 18 sin35° = 10.3 m s⁻¹","Time to return to ground: 0 = 10.3t − ½(9.81)t² (or t = 2u/g)","t = 2.1 s","Horizontal component = 18 cos35° = 14.7 m s⁻¹","Range = 14.7 × 2.1 = 31 m"],tip:"Time is the link between the vertical and horizontal motion."}]});

T("frc",3,"3.2","Forces in action",{
 pts:["Weight, normal contact force, tension, upthrust, friction and drag; free-body diagrams.","Centre of mass and centre of gravity.","Moments, the principle of moments, couples and torque.","Equilibrium: resultant force and resultant moment both zero; triangle of forces.","Density, pressure in fluids, upthrust (Archimedes), drag and terminal velocity."],
 eq:[["Moment","force × perpendicular distance from the pivot"],["Torque of a couple","force × perpendicular separation of the forces"],["Pressure","p = F/A ; p = hρg"],["Upthrust","U = ρVg (weight of fluid displaced)"],["Weight","W = mg"]],
 tips:["Take moments about a point where an unknown force acts, so that force drops out.","Use the perpendicular distance to the line of action of the force."],
 cards:[
  ["State the conditions for equilibrium.","The resultant force is zero and the resultant moment about any point is zero."],
  ["State the principle of moments.","For a body in equilibrium, the sum of the clockwise moments about any point equals the sum of the anticlockwise moments about the same point."],
  ["Define a couple.","A pair of equal and opposite coplanar forces that do not act along the same line. Torque = one force × perpendicular distance between the forces."],
  ["Explain the origin of upthrust.","Pressure increases with depth (p = hρg), so the upward force on the bottom surface is greater than the downward force on the top surface."],
  ["Describe the motion of a falling object that reaches terminal velocity.","Initially a = g. As speed rises drag rises, resultant force and acceleration fall. At terminal velocity drag = weight, resultant force is zero and speed is constant."]],
 qs:[
  {m:4,cw:"Calculate",q:"A uniform plank of weight 100 N and length 5.0 m rests on two supports A and B as shown. A person of weight 600 N stands 1.0 m from the left-hand end. Calculate the reaction forces at A and at B.",fig:["beam",{L:5,sup:[0.5,4.0],loads:[{x:1.0,l:"600 N"}],W:"100 N",names:["A","B"]}],
   ms:["Take moments about A (or B): clockwise = anticlockwise","R_B × 3.5 = 100 × 2.0 + 600 × 0.5","R_B = 143 N","R_A = 700 − 143 = 557 N (resultant force zero)"],tip:"Pick the pivot at one unknown to eliminate it."},
  {m:4,cw:"Explain",q:"A skydiver jumps from an aeroplane and falls through the air. Sketch of her velocity against time is shown. Explain the shape of the graph.",fig:["termvel"],
   ms:["At t = 0 the only force is weight, so a = g (gradient is steepest)","As speed increases the drag force increases","Resultant force decreases so the acceleration decreases (gradient falls)","At terminal velocity drag = weight, resultant force is zero and velocity is constant"],tip:"Link each change in gradient to the resultant force."}]});

T("wep",3,"3.3","Work, energy and power",{
 pts:["Work done by a force, W = Fs cosθ; area under a force–displacement graph.","Kinetic energy and gravitational potential energy changes.","Conservation of energy; efficiency.","Power as rate of doing work; P = Fv."],
 eq:[["Work done","W = Fs cosθ"],["Kinetic energy","Eₖ = ½mv²"],["Gravitational PE change","ΔE = mgΔh"],["Power","P = W/t = Fv"],["Efficiency","useful output ÷ total input"]],
 tips:["A force perpendicular to the motion does no work.","Efficiency is a ratio of like quantities (energy or power), never mix them."],
 cards:[
  ["Define work done by a force.","Energy transferred when a force moves its point of application in the direction of the force; W = Fs cosθ."],
  ["Why does a centripetal force do no work on a body in uniform circular motion?","The force is always perpendicular to the displacement, so cosθ = 0."],
  ["A car travels at constant speed v against a drag force F. What is the power output?","P = Fv."],
  ["State the principle of conservation of energy.","Energy cannot be created or destroyed, only transferred from one form to another; the total energy of a closed system is constant."],
  ["What does the area under a force–extension graph represent?","The work done on the material (elastic strain energy if deformation is elastic)."]],
 qs:[
  {m:3,cw:"Calculate",q:"A car of mass 1200 kg travelling at 25 m s⁻¹ brakes to rest in a distance of 50 m. Calculate the average braking force.",
   ms:["Initial kinetic energy = ½ × 1200 × 25² = 3.75 × 10⁵ J","Work done by brakes = Fs = loss of kinetic energy","F = 3.75 × 10⁵ / 50 = 7.5 × 10³ N"],tip:"Energy method is shorter than suvat plus F = ma."},
  {m:4,cw:"Calculate",q:"A roller-coaster car of mass 400 kg is released from rest at a height of 30 m above the lowest point of the track. 15% of the initial gravitational potential energy is dissipated as thermal energy. Calculate the speed of the car at the lowest point.",
   ms:["Initial GPE = mgh = 400 × 9.81 × 30 = 1.18 × 10⁵ J","Kinetic energy at bottom = 0.85 × 1.18 × 10⁵ = 1.00 × 10⁵ J","½mv² = 1.00 × 10⁵","v = 22 m s⁻¹"],tip:"The mass cancels if you work with fractions of mgh."}]});

T("mat",3,"3.4","Materials",{
 pts:["Hooke's law, spring constant, force–extension graphs for springs and wires.","Elastic and plastic deformation; elastic limit; limit of proportionality.","Stress, strain and the Young modulus.","Stress–strain graphs: yield, ultimate tensile stress, fracture; brittle, ductile and polymeric materials.","Elastic strain energy as area under a force–extension graph."],
 eq:[["Hooke's law","F = kx"],["Stress","σ = F/A"],["Strain","ε = x/L"],["Young modulus","E = σ/ε = FL/(Ax)"],["Elastic energy","E = ½Fx = ½kx²"]],
 tips:["Area A is πd²/4 with d in metres (convert mm properly).","½Fx only holds while Hooke's law is obeyed."],
 cards:[
  ["Define the Young modulus.","The ratio of tensile stress to tensile strain for a material, within the limit of proportionality. Unit: Pa."],
  ["Describe an experiment to determine the Young modulus of a metal wire.","Long thin wire fixed at one end over a pulley, masses added in steps. Measure diameter with a micrometer (several places), original length with a ruler, extension with a marker and scale or vernier. Plot stress against strain (or F against x); gradient gives E (or EA/L)."],
  ["Distinguish elastic and plastic deformation.","Elastic: material returns to its original shape when the force is removed. Plastic: permanent deformation remains."],
  ["Describe ductile, brittle and polymeric behaviour.","Ductile: large plastic deformation before fracture. Brittle: fractures with little or no plastic deformation. Polymeric: non-linear extension, often with a large extension and hysteresis."],
  ["What does the area under a force–extension graph represent?","Work done on the material = energy stored (elastic strain energy if elastic)."]],
 qs:[
  {m:5,cw:"Calculate",q:"A steel wire of length 2.50 m and diameter 0.60 mm is stretched by a force of 80 N and extends by 3.5 mm. Calculate (i) the stress, (ii) the strain, (iii) the Young modulus of the steel and (iv) the energy stored in the wire.",
   ms:["A = π(0.30 × 10⁻³)² = 2.83 × 10⁻⁷ m² and stress = 80/A = 2.8 × 10⁸ Pa","Strain = 3.5 × 10⁻³ / 2.50 = 1.4 × 10⁻³","E = stress/strain = 2.0 × 10¹¹ Pa","Energy = ½Fx = ½ × 80 × 3.5 × 10⁻³","= 0.14 J"],tip:"Radius = half the diameter before squaring."},
  {m:4,cw:"Describe",q:"The stress–strain graph for a metal wire is shown. Describe and explain the behaviour of the wire between O and S.",fig:["stress"],
   ms:["O to P: straight line through the origin, stress ∝ strain (Hooke's law obeyed); P is the limit of proportionality","At Q the yield point: strain increases a lot with little increase in stress, the wire deforms plastically (permanent extension)","R is the ultimate tensile stress: the maximum stress the wire can withstand","S: fracture; if unloaded beyond the elastic limit the wire does not return to its original length"],tip:"Name each labelled point as you describe it."}]});

T("newt",3,"3.5","Newton's laws and momentum",{
 pts:["Newton's three laws of motion; F = ma, F = Δp/Δt.","Linear momentum and its conservation in collisions and explosions.","Elastic and inelastic collisions in one and two dimensions.","Impulse and force–time graphs."],
 eq:[["Momentum","p = mv"],["Second law","F = Δp/Δt"],["Impulse","FΔt = Δp"],["Elastic collision (1D)","relative speed of approach = relative speed of separation"]],
 tips:["Momentum is a vector, so use a sign convention for direction.","Kinetic energy is not conserved in inelastic collisions, momentum is conserved in all closed-system collisions."],
 cards:[
  ["State Newton's third law.","When body A exerts a force on body B, B exerts an equal and opposite force on A. The forces are the same type, act on different bodies and lie along the same line."],
  ["Why are weight and normal contact force on a book on a table NOT a third-law pair?","They act on the same body and are different types of force. The pair for weight is the book's pull on Earth."],
  ["Define impulse.","Force × time for which it acts, FΔt, equal to the change in momentum. It is the area under a force–time graph."],
  ["State the principle of conservation of momentum.","In a closed system (no external resultant force) the total momentum before an interaction equals the total momentum after."],
  ["What is an elastic collision?","One in which total kinetic energy is conserved (and momentum, as in all closed collisions)."]],
 qs:[
  {m:4,cw:"Calculate",q:"A trolley of mass 1.2 kg moving at 0.80 m s⁻¹ collides with a stationary trolley of mass 0.60 kg. The trolleys stick together. Calculate (i) their common speed and (ii) the kinetic energy lost.",
   ms:["Momentum before = 1.2 × 0.80 = 0.96 N s, equals momentum after (1.8 v)","v = 0.53 m s⁻¹","KE before = ½ × 1.2 × 0.80² = 0.384 J, KE after = ½ × 1.8 × 0.533² = 0.256 J","KE lost = 0.13 J"],tip:"Show momentum conservation before the algebra."},
  {m:4,cw:"Calculate",q:"A ball of mass 0.15 kg strikes a wall at 12 m s⁻¹ and rebounds along the same line at 9.0 m s⁻¹. The contact time is 8.0 ms. Calculate the average force exerted on the ball by the wall.",
   ms:["Take towards the wall as positive: Δp = 0.15 × (−9.0) − 0.15 × 12 (directions opposite)","Magnitude of change in momentum = 0.15 × 21 = 3.15 N s","F = Δp/Δt = 3.15 / 8.0 × 10⁻³","F = 3.9 × 10² N"],tip:"A rebound means the velocities have opposite signs, so add the magnitudes."}]});
T("chg",4,"4.1","Charge and current",{
 pts:["Electric current as rate of flow of charge; charge is quantised (e = 1.60 × 10⁻¹⁹ C).","Conventional current and electron flow.","Kirchhoff's first law as conservation of charge.","Mean drift velocity: I = nAvq.","Conductors, semiconductors and insulators in terms of n."],
 eq:[["Charge","ΔQ = IΔt"],["Drift velocity","I = nAvq"],["Elementary charge","e = 1.60 × 10⁻¹⁹ C"]],
 tips:["In I = nAvq, n is the number per cubic metre of charge carriers, not the number in the wire."],
 cards:[
  ["State Kirchhoff's first law.","The sum of the currents into a junction equals the sum of the currents out of it (conservation of charge)."],
  ["Define the coulomb.","The charge that flows past a point in one second when the current is one ampere."],
  ["In I = nAvq what does n represent?","The number density of charge carriers (number per unit volume)."],
  ["Why is the drift velocity much bigger in a semiconductor than in a metal for the same current and cross-section?","A semiconductor has far fewer free charge carriers per unit volume (smaller n), so each must move faster: v = I/nAq."],
  ["What is the typical order of magnitude of the drift velocity in a metal wire?","About 10⁻⁴ m s⁻¹ (a fraction of a millimetre per second)."]],
 qs:[
  {m:3,cw:"Calculate",q:"A copper wire of cross-sectional area 1.5 mm² carries a current of 3.0 A. The number density of free electrons in copper is 8.5 × 10²⁸ m⁻³. Calculate the mean drift velocity of the electrons.",
   ms:["Use I = nAvq with A = 1.5 × 10⁻⁶ m²","v = I / (nAe) = 3.0 / (8.5 × 10²⁸ × 1.5 × 10⁻⁶ × 1.60 × 10⁻¹⁹)","v = 1.5 × 10⁻⁴ m s⁻¹"],tip:"Convert mm² to m² (× 10⁻⁶)."},
  {m:2,cw:"Explain",q:"A lamp lights almost instantly when a switch is closed even though the drift velocity of the electrons is very small. Explain why.",
   ms:["Free electrons are already present throughout the circuit","An electric field is established along the circuit (travelling at close to the speed of light) so all the electrons start to drift at (almost) the same time"],tip:"Don't say the electrons travel from the battery to the lamp."}]});

T("res",4,"4.2","Energy, power and resistance",{
 pts:["Potential difference, emf, resistance; Ohm's law.","I–V characteristics of a metallic conductor, filament lamp, diode, thermistor and LDR.","Resistivity: R = ρL/A.","Electrical power P = VI = I²R = V²/R and energy E = Pt; kilowatt-hour."],
 eq:[["Potential difference","V = W/Q"],["Resistance","R = V/I"],["Resistivity","R = ρL/A"],["Power","P = VI = I²R = V²/R"],["Energy","E = Pt = VIt"]],
 tips:["Resistance at a point on a curve is V/I (not the gradient of the I–V graph)."],
 cards:[
  ["Define potential difference.","The energy transferred (from electrical to other forms) per unit charge between two points: V = W/Q."],
  ["State Ohm's law.","For a metallic conductor at constant temperature the current is directly proportional to the potential difference across it."],
  ["Explain why the I–V curve of a filament lamp flattens at higher V.","The filament heats up, lattice ions vibrate with greater amplitude, more frequent collisions with electrons, so resistance increases (I rises less than V)."],
  ["Explain why an NTC thermistor's resistance falls when heated.","More charge carriers are released (n increases) as temperature rises, so resistance decreases."],
  ["Define resistivity.","For a material, ρ = RA/L: the resistance of a sample of unit length and unit cross-sectional area. Unit: Ω m."],
  ["Describe how an LDR's resistance depends on light intensity.","Resistance decreases as light intensity increases because more charge carriers are released."]],
 qs:[
  {m:5,cw:"Explain",q:"The I–V graph for a filament lamp is shown. Calculate the resistance of the lamp at 6.0 V and at 12.0 V, and explain why the two values are different.",fig:["iv"],
   ms:["R = V/I = 6.0/0.50 = 12 Ω","R = 12.0/0.78 = 15 Ω","The resistance increases as V (and so I) increases","Because the filament's temperature rises, ions vibrate with larger amplitude","More collisions between electrons and ions so resistivity (resistance) increases"],tip:"Use V/I at each point, do not use the gradient."},
  {m:4,cw:"Calculate",q:"A nichrome wire of length 1.50 m and diameter 0.40 mm has resistivity 1.1 × 10⁻⁶ Ω m. Calculate (i) its resistance and (ii) the power dissipated when it is connected across a 6.0 V supply of negligible internal resistance.",
   ms:["A = π(0.20 × 10⁻³)² = 1.26 × 10⁻⁷ m²","R = ρL/A = 1.1 × 10⁻⁶ × 1.50 / 1.26 × 10⁻⁷","= 13 Ω","P = V²/R = 36 / 13.1 = 2.7 W"],tip:"Keep the unrounded R for the power calculation."}]});

T("circ",4,"4.3","Electrical circuits",{
 pts:["Series and parallel circuits; combining resistors.","Kirchhoff's second law as conservation of energy.","emf, internal resistance and terminal potential difference.","Potential dividers, including with thermistors and LDRs."],
 eq:[["Series","R = R₁ + R₂ + …"],["Parallel","1/R = 1/R₁ + 1/R₂ + …"],["emf","E = I(R + r) = V + Ir"],["Terminal pd","V = E − Ir"],["Potential divider","V_out = V_in × R₂ / (R₁ + R₂)"]],
 tips:["Check the parallel answer is smaller than the smallest branch.","The terminal pd is the pd across the external circuit, not the emf."],
 cards:[
  ["State Kirchhoff's second law.","Around any closed loop the sum of the emfs equals the sum of the potential differences (conservation of energy)."],
  ["Define emf.","Energy transferred per unit charge by a source in converting chemical (or other) energy to electrical energy; unlike p.d., it is the energy supplied to charge."],
  ["Why does the terminal pd of a cell fall when current drawn increases?","Lost volts Ir across internal resistance increases, so V = E − Ir decreases."],
  ["Describe how to find E and r experimentally.","Vary the external resistance, measure V and I, plot V against I. Gradient = −r, y-intercept = E."],
  ["Why does adding a resistor in parallel decrease the total resistance?","It provides an additional path for current; more current flows for the same p.d."]],
 qs:[
  {m:5,cw:"Calculate",q:"A battery of emf 12.0 V and internal resistance 0.50 Ω is connected to a 4.0 Ω resistor in parallel with a 12 Ω resistor as shown. Calculate (i) the total resistance of the external circuit, (ii) the current from the battery, (iii) the terminal pd and (iv) the current in the 4.0 Ω resistor.",fig:["circ1"],
   ms:["1/R = 1/4.0 + 1/12 giving R = 3.0 Ω","I = E/(R + r) = 12.0 / 3.5 = 3.4 A","Lost volts Ir = 3.43 × 0.50 = 1.7 V","Terminal pd = E − Ir = 12.0 − 1.7 = 10.3 V","I₄ = V/R = 10.3 / 4.0 = 2.6 A"],tip:"Terminal pd is also I × R_external = 3.43 × 3.0."},
  {m:4,cw:"Calculate",q:"A potential divider is made from a 2.0 kΩ resistor in series with an NTC thermistor across a 5.0 V supply. The output voltage is taken across the 2.0 kΩ resistor. The thermistor resistance is 6.0 kΩ at 15 °C and 1.0 kΩ at 40 °C. Calculate the output voltage at each temperature and state how the output changes as the temperature rises.",fig:["divider"],
   ms:["V_out = 5.0 × 2.0/(2.0 + 6.0) = 1.25 V at 15 °C","V_out = 5.0 × 2.0/(2.0 + 1.0) = 3.3 V at 40 °C","Output voltage increases as temperature increases","Because the thermistor's resistance falls so it takes a smaller share of the supply pd"],tip:"The component with the larger resistance gets the larger share of the pd."}]});

T("wav",4,"4.4","Waves",{
 pts:["Progressive transverse and longitudinal waves: amplitude, wavelength, frequency, period, phase, v = fλ.","Intensity I = P/A and I ∝ amplitude².","Polarisation as evidence for the transverse nature of light.","Refraction, refractive index, total internal reflection.","Superposition, coherence, interference and path difference.","Stationary waves on strings and in air columns.","Diffraction; double slit λ = ax/D; diffraction grating dsinθ = nλ."],
 eq:[["Wave speed","v = fλ ; T = 1/f"],["Intensity","I = P/A ; I ∝ A²"],["Refractive index","n = sin i / sin r = c/v"],["Critical angle","sin C = 1/n"],["Double slit","λ = ax / D"],["Diffraction grating","d sinθ = nλ"],["String (fundamental)","f = (1/2L)√(T/μ)"]],
 tips:["Fringe spacing x is between adjacent fringes; the formula's x is NOT the distance from the centre unless you divide.","Use the number of lines per metre for a grating: d = 1/N."],
 cards:[
  ["State the conditions for observing a stable interference pattern.","Coherent sources (constant phase difference, same frequency), similar amplitude, and waves of the same type (and same polarisation)."],
  ["Conditions for constructive and destructive interference in terms of path difference?","Constructive: path difference = nλ. Destructive: (n + ½)λ."],
  ["Compare stationary and progressive waves.","Stationary: no net energy transfer, nodes and antinodes, amplitude depends on position, particles between adjacent nodes in phase. Progressive: energy transferred, all particles same amplitude (with a phase lag)."],
  ["How does the fringe spacing change if D increases / a decreases / blue light replaces red?","Increases / increases / decreases (x = λD/a and λ_blue < λ_red)."],
  ["Why is a diffraction grating better than a double slit for measuring wavelengths?","Many slits give much sharper, brighter maxima at larger angles, so λ can be found with smaller percentage uncertainty."],
  ["What does polarisation show about light?","Light is a transverse wave (oscillations perpendicular to the direction of travel); longitudinal waves cannot be polarised."],
  ["Conditions for total internal reflection?","Light must travel from higher to lower refractive index and the angle of incidence must exceed the critical angle."]],
 qs:[
  {m:5,cw:"Calculate",q:"In a double-slit experiment the slit separation is 0.50 mm and the screen is 2.0 m from the slits. The fringe separation is 2.4 mm. (i) Calculate the wavelength of the light. (ii) The screen is moved closer to the slits. State and explain the effect on the fringe separation.",fig:["dslit"],
   ms:["λ = ax/D","= 0.50 × 10⁻³ × 2.4 × 10⁻³ / 2.0","= 6.0 × 10⁻⁷ m (600 nm)","Fringe separation decreases","Because x ∝ D (for fixed λ and a)"],tip:"Convert mm to m for every length."},
  {m:4,cw:"Calculate",q:"Light of wavelength 589 nm is incident normally on a diffraction grating with 600 lines per mm. Calculate the angle of the first-order maximum and the maximum number of orders that can be seen on one side of the central maximum.",
   ms:["d = 1/(600 × 10³) = 1.67 × 10⁻⁶ m","sinθ = λ/d = 0.353, so θ = 20.7° ≈ 21°","Maximum n when sinθ = 1: n = d/λ = 2.83","So the maximum order is 2 (n must be a whole number)"],tip:"Always round the maximum order down."},
  {m:3,cw:"Calculate",q:"A string of length 0.80 m is stretched between two fixed points and vibrates in its fundamental mode at 150 Hz as shown. Calculate the speed of the transverse waves on the string and the frequency of the third harmonic.",fig:["stringwave",{n:[1]}],
   ms:["λ = 2L = 1.6 m","v = fλ = 150 × 1.6 = 240 m s⁻¹","Third harmonic frequency = 3 × 150 = 450 Hz"],tip:"Fundamental has half a wavelength between the fixed ends."}]});

T("qua",4,"4.5","Quantum physics",{
 pts:["Photon model: E = hf = hc/λ; the electronvolt.","Photoelectric effect: threshold frequency, work function, hf = φ + Eₖ(max); evidence for photons.","Wave–particle duality: electron diffraction and de Broglie λ = h/p.","Energy levels in atoms, line emission and absorption spectra; hf = E₂ − E₁."],
 eq:[["Photon energy","E = hf = hc/λ"],["Photoelectric equation","hf = φ + Eₖ(max)"],["de Broglie","λ = h/p = h/mv"],["Photon from transition","hf = E₂ − E₁"],["Electronvolt","1 eV = 1.60 × 10⁻¹⁹ J"]],
 tips:["Wave theory predicts a delay and no threshold; the photon model explains both.","Convert eV to J before using h in J s."],
 cards:[
  ["Define the work function of a metal.","The minimum energy required to remove an electron from the surface of the metal."],
  ["Why can't wave theory explain the photoelectric effect?","It predicts emission at any frequency given enough intensity and time (no threshold, a delay), and KE depending on intensity; none of these is observed."],
  ["Explain the threshold frequency using the photon model.","One photon interacts with one electron; the photon energy hf must be at least the work function φ, so there is a minimum frequency f₀ = φ/h."],
  ["Above the threshold, what happens to KE(max) and the number of electrons emitted per second if the intensity is increased?","KE(max) is unchanged; the rate of emission increases (more photons per second)."],
  ["What does electron diffraction demonstrate?","The wave nature of particles; the diffraction pattern is consistent with λ = h/p."],
  ["What do line spectra tell us about atoms?","Electrons occupy discrete energy levels; photons emitted/absorbed have energies equal to the differences between levels."],
  ["Define the electronvolt.","The kinetic energy gained by an electron accelerated through a potential difference of 1 V (1.60 × 10⁻¹⁹ J)."]],
 qs:[
  {m:4,cw:"Calculate",q:"Ultraviolet light of wavelength 250 nm is incident on a metal surface of work function 4.3 eV. Calculate the maximum kinetic energy of the emitted electrons in joules.",
   ms:["E = hc/λ = 6.63 × 10⁻³⁴ × 3.00 × 10⁸ / 250 × 10⁻⁹ = 7.96 × 10⁻¹⁹ J","φ = 4.3 × 1.60 × 10⁻¹⁹ = 6.88 × 10⁻¹⁹ J","KE(max) = hf − φ","= 1.1 × 10⁻¹⁹ J"],tip:"Convert eV to joules before subtracting."},
  {m:5,cw:"Determine",q:"The graph shows the maximum kinetic energy of photoelectrons against the frequency of the incident radiation for a metal. Use the graph to determine the Planck constant (in J s) and the work function of the metal (in J).",fig:["pe"],
   ms:["Gradient = h","Gradient = 2.9 eV / (7.0 × 10¹⁴ Hz) with conversion to J (× 1.60 × 10⁻¹⁹)","h = 6.6 × 10⁻³⁴ J s","Threshold frequency f₀ = 5.0 × 10¹⁴ Hz (x-intercept) so φ = hf₀","φ = 3.3 × 10⁻¹⁹ J"],tip:"The x-intercept is f₀. The y-intercept (extended) is −φ."},
  {m:4,cw:"Calculate",q:"An electron is accelerated from rest through a potential difference of 150 V. Calculate its de Broglie wavelength.",
   ms:["Kinetic energy = eV = 1.60 × 10⁻¹⁹ × 150 = 2.4 × 10⁻¹⁷ J","p = √(2mE) = √(2 × 9.11 × 10⁻³¹ × 2.4 × 10⁻¹⁷) = 6.6 × 10⁻²⁴ kg m s⁻¹","λ = h/p = 6.63 × 10⁻³⁴ / 6.6 × 10⁻²⁴","= 1.0 × 10⁻¹⁰ m"],tip:"Non-relativistic speeds are fine at this energy."},
  {m:4,cw:"Calculate",q:"The energy levels of the hydrogen atom are shown. An electron falls from n = 3 to n = 2. Calculate the energy and the wavelength of the photon emitted, and state which region of the spectrum it is in.",fig:["levels"],
   ms:["ΔE = −1.51 − (−3.40) = 1.89 eV","= 1.89 × 1.60 × 10⁻¹⁹ = 3.02 × 10⁻¹⁹ J","λ = hc/E = 6.63 × 10⁻³⁴ × 3.00 × 10⁸ / 3.02 × 10⁻¹⁹ = 6.6 × 10⁻⁷ m (658 nm)","Visible (red)"],tip:"Photon energy is the difference between the levels."}]});

T("thm",5,"5.1","Thermal physics",{
 pts:["Temperature scales; absolute zero; internal energy.","Specific heat capacity and specific latent heat; heating curves.","Ideal gas laws, pV = nRT and pV = NkT.","Kinetic theory: pV = ⅓Nm⟨c²⟩, ½m⟨c²⟩ = (3/2)kT.","Evidence for molecular motion: Brownian motion."],
 eq:[["Heat energy","Q = mcΔθ"],["Latent heat","Q = mL"],["Ideal gas","pV = nRT = NkT"],["Kinetic theory","pV = ⅓Nm⟨c²⟩"],["Mean KE per molecule","½m⟨c²⟩ = (3/2)kT"]],
 tips:["T in kelvin for gas laws.","Use ⟨c²⟩ (mean square speed) not the square of the mean speed."],
 cards:[
  ["Define internal energy.","The sum of the random distribution of kinetic and potential energies of the atoms or molecules of a system."],
  ["What happens to temperature and internal energy while a substance melts?","Temperature is constant, internal energy increases (potential energy of molecules rises as bonds are broken)."],
  ["List the assumptions of the kinetic theory of gases.","Large number of identical molecules in random motion; negligible volume compared with container; elastic collisions; no intermolecular forces except during collisions; collision time negligible; Newton's laws apply."],
  ["Explain how molecules cause gas pressure.","Molecules collide with the walls, changing momentum; force = rate of change of momentum; the very large number of collisions gives a steady force over an area."],
  ["Brownian motion is evidence for what?","The random motion of molecules: visible particles are knocked unevenly by invisible fast-moving molecules in the fluid."],
  ["What is absolute zero?","0 K (−273 °C): the lowest possible temperature, where the molecules have minimum internal energy."]],
 qs:[
  {m:4,cw:"Calculate",q:"A heater of power 500 W is used to melt 0.20 kg of ice already at 0 °C. The specific latent heat of fusion of ice is 3.34 × 10⁵ J kg⁻¹. Calculate the time taken, assuming all energy goes into the ice, and explain why the temperature does not change while it melts.",fig:["heatcurve"],
   ms:["Q = mL = 0.20 × 3.34 × 10⁵ = 6.7 × 10⁴ J","t = Q/P = 6.68 × 10⁴ / 500 = 1.3 × 10² s","Energy supplied increases the potential energy of the molecules as bonds break","Mean kinetic energy (so temperature) stays constant"],tip:"Link temperature to mean kinetic energy, not total energy."},
  {m:4,cw:"Calculate",q:"A sealed container of volume 2.0 × 10⁻³ m³ holds 0.10 mol of an ideal gas at 300 K. Calculate (i) the pressure of the gas, (ii) the number of molecules and (iii) the mean kinetic energy of one molecule.",
   ms:["p = nRT/V = 0.10 × 8.31 × 300 / 2.0 × 10⁻³ = 1.2 × 10⁵ Pa","N = nN_A = 0.10 × 6.02 × 10²³ = 6.0 × 10²² molecules","Mean KE = (3/2)kT","= 1.5 × 1.38 × 10⁻²³ × 300 = 6.2 × 10⁻²¹ J"],tip:"R = 8.31 J mol⁻¹ K⁻¹; k = 1.38 × 10⁻²³ J K⁻¹."}]});

T("circm",5,"5.2","Circular motion",{
 pts:["Radians; angular velocity ω = 2π/T = 2πf; v = ωr.","Centripetal acceleration a = v²/r = ω²r.","Centripetal force F = mv²/r = mω²r and the sources of the centripetal force in real situations."],
 eq:[["Angular speed","ω = Δθ/Δt = 2πf = 2π/T"],["Linear speed","v = ωr"],["Centripetal acceleration","a = v²/r = ω²r"],["Centripetal force","F = mv²/r = mω²r"]],
 tips:["Centripetal force is the resultant force towards the centre, not an extra force. Name the real force that provides it."],
 cards:[
  ["Why is a body in uniform circular motion accelerating?","Its velocity changes direction, so it has an acceleration towards the centre."],
  ["Convert 90° and 180° to radians.","π/2 rad and π rad."],
  ["Name the force providing the centripetal force for: a planet in orbit; a car on a flat bend; a conical pendulum.","Gravity; friction between tyres and road; the horizontal component of the tension."],
  ["Why does the centripetal force do no work?","It acts perpendicular to the velocity so there is no displacement in the direction of the force."],
  ["A mass on a string is whirled in a vertical circle. Condition at the top to just stay in a circle?","Tension is zero; weight alone provides the centripetal force: mg = mv²/r."]],
 qs:[
  {m:4,cw:"Calculate",q:"A car of mass 900 kg travels round a flat circular bend of radius 40 m at 15 m s⁻¹. Calculate (i) the centripetal force required and (ii) the maximum speed for which the car does not skid if the maximum frictional force is 0.60 of its weight.",fig:["circ"],
   ms:["F = mv²/r = 900 × 15² / 40","= 5.1 × 10³ N","Max friction = 0.60 mg provides the centripetal force: 0.60 mg = mv²/r","v = √(0.60 × 9.81 × 40) = 15 m s⁻¹"],tip:"The mass cancels in part (ii)."},
  {m:4,cw:"Calculate",q:"A mass of 0.20 kg is whirled in a horizontal circle of radius 0.80 m on a string with a period of 0.50 s. Calculate (i) the angular speed, (ii) the linear speed and (iii) the tension in the string, ignoring gravity.",
   ms:["ω = 2π/T = 2π/0.50 = 13 rad s⁻¹","v = ωr = 12.6 × 0.80 = 10 m s⁻¹","Tension = centripetal force = mω²r","= 0.20 × 12.6² × 0.80 = 25 N"],tip:"Use ω rather than v when the period is given."}]});

T("osc",5,"5.3","Oscillations",{
 pts:["Simple harmonic motion: a ∝ −x; a = −ω²x; displacement, velocity and acceleration graphs.","Energy exchange between kinetic and potential energy.","Spring–mass and pendulum periods.","Free and forced oscillations, damping and resonance."],
 eq:[["Defining equation","a = −ω²x"],["Displacement","x = A cos(ωt)"],["Velocity","v = ±ω√(A² − x²) ; v_max = ωA"],["Spring–mass","T = 2π√(m/k)"],["Pendulum","T = 2π√(l/g)"],["Total energy","E = ½mω²A²"]],
 tips:["Calculator in radians for x = A cos ωt.","Maximum acceleration is at maximum displacement; maximum speed is at equilibrium."],
 cards:[
  ["State the conditions for simple harmonic motion.","Acceleration is proportional to displacement from the equilibrium position and directed towards it (a ∝ −x)."],
  ["Where are speed and acceleration maximum in SHM?","Speed: at the equilibrium position. Acceleration: at maximum displacement (the amplitude)."],
  ["Describe the energy changes in SHM.","KE is maximum at equilibrium and PE at the extremes; total energy is constant (undamped) and equals ½mω²A²."],
  ["Describe resonance.","When the driving frequency equals the natural frequency, the amplitude of the oscillation is a maximum because energy transfer is most efficient (driver leads by π/2)."],
  ["What does damping do and what is critical damping?","Damping removes energy so amplitude falls. Critical damping returns the system to equilibrium in the shortest time without oscillating."],
  ["Give one example each of unwanted and useful resonance.","Unwanted: bridge or building vibrating in wind or earthquakes (damped by dampers). Useful: microwave oven, MRI, tuning a radio."]],
 qs:[
  {m:4,cw:"Calculate",q:"A mass of 0.25 kg on a spring of spring constant 40 N m⁻¹ oscillates with amplitude 6.0 cm as shown in the graph. Calculate (i) the period, (ii) the maximum speed and (iii) the maximum acceleration.",fig:["shm"],
   ms:["T = 2π√(m/k) = 2π√(0.25/40) = 0.50 s","ω = 2π/T = 12.6 rad s⁻¹","v_max = ωA = 12.6 × 0.060 = 0.76 m s⁻¹","a_max = ω²A = 160 × 0.060 = 9.6 m s⁻²"],tip:"ω² = k/m gives 160 directly."},
  {m:3,cw:"Explain",q:"The graph shows the energy of a mass undergoing SHM against its displacement from equilibrium. Identify the curves X, Y and Z and explain their shapes.",fig:["shmE"],
   ms:["X is kinetic energy (maximum at x = 0, zero at the amplitude)","Y is total energy: constant (no dissipation)","Z is potential energy: ½mω²x², parabolic, zero at x = 0, maximum at ±A"],tip:"KE = total − PE so the two parabolas are mirror images."},
  {m:4,cw:"Explain",q:"The graph shows the amplitude of a driven oscillator as the driving frequency is varied for two different amounts of damping, P and Q. State which curve has the heavier damping and describe the effect of damping on resonance.",fig:["reson"],
   ms:["Q shows heavier damping (lower, broader peak)","Resonance occurs when the driving frequency equals the natural frequency f₀","Increasing damping reduces the amplitude at resonance","and the peak occurs at a slightly lower frequency and becomes broader"],tip:"Both peak height and sharpness change."}]});

T("grav",5,"5.4","Gravitational fields",{
 pts:["Radial and uniform gravitational fields; field lines.","Newton's law of gravitation; g = GM/r².","Gravitational potential and potential energy; work done.","Orbits of planets and satellites; Kepler's third law; geostationary orbits."],
 eq:[["Force","F = Gm₁m₂/r²"],["Field strength","g = F/m = GM/r²"],["Potential","V = −GM/r"],["Energy change","ΔE = mΔV"],["Orbital speed","v = √(GM/r)"],["Kepler III","T² = (4π²/GM) r³"]],
 tips:["r is the distance from the centre of the mass, not the height above the surface.","Gravitational potential is negative, so a smaller magnitude means higher up."],
 cards:[
  ["State Newton's law of gravitation.","Any two point masses attract with a force proportional to the product of their masses and inversely proportional to the square of their separation."],
  ["Why is gravitational potential negative?","It is defined as zero at infinity and gravity is attractive, so work must be done against the field to move a mass to infinity; a mass nearer the source has lower (more negative) potential."],
  ["State the features of a geostationary orbit.","Above the equator, orbits west to east, period 24 h, same angular speed as Earth, orbit radius about 4.2 × 10⁷ m."],
  ["State Kepler's third law.","The square of the orbital period is proportional to the cube of the orbital radius, T² ∝ r³."],
  ["What do the gradient of a V–r graph and the area under a g–r graph give?","Gradient of V–r = −g. Area under g–r = −ΔV."],
  ["Define gravitational field strength.","Force per unit mass on a small test mass placed in the field."]],
 qs:[
  {m:5,cw:"Calculate",q:"The Earth has mass 5.97 × 10²⁴ kg and radius 6.37 × 10⁶ m. The International Space Station orbits 400 km above the surface. Calculate (i) g at the ISS, (ii) its orbital speed and (iii) its orbital period in minutes. (G = 6.67 × 10⁻¹¹ N m² kg⁻²)",
   ms:["r = 6.37 × 10⁶ + 4.0 × 10⁵ = 6.77 × 10⁶ m","g = GM/r² = 8.7 m s⁻²","Gravity provides centripetal force: v = √(GM/r)","= 7.7 × 10³ m s⁻¹","T = 2πr/v = 5.5 × 10³ s = 92 minutes"],tip:"Add the radius of the Earth to the altitude."},
  {m:4,cw:"Show that",q:"Show that the radius of orbit of a geostationary satellite is 4.2 × 10⁷ m.",
   ms:["Period T = 24 h = 86 400 s","GMm/r² = mω²r so T² = 4π²r³/GM","r³ = GMT²/4π² = 6.67 × 10⁻¹¹ × 5.97 × 10²⁴ × 86400² / 4π²","r = 4.2 × 10⁷ m"],tip:"Use T = 86 400 s (or 23 h 56 min for sidereal day)."}]});

T("astro",5,"5.5","Astrophysics and cosmology",{
 pts:["Astronomical telescopes: refracting and reflecting (Cassegrain); magnification in normal adjustment; collecting power and resolving power.","Classification of stars, Hertzsprung–Russell diagram, Wien's law, Stefan–Boltzmann law.","Distances: parallax, light-year, parsec; standard candles.","Doppler effect and redshift, Hubble's law, the Big Bang, the cosmic microwave background."],
 eq:[["Telescope magnification","M = f_o / f_e"],["Resolving power","θ ≈ λ/D"],["Stefan–Boltzmann","L = 4πr²σT⁴"],["Wien's law","λ_max T = 2.898 × 10⁻³ m K"],["Redshift","Δλ/λ ≈ v/c"],["Hubble's law","v = H₀d ; age ≈ 1/H₀"],["Intensity from a star","I = L/(4πd²)"]],
 tips:["Wien's law gives the peak wavelength, not the colour at only one wavelength.","Redshift approximation only valid for v ≪ c."],
 cards:[
  ["State Wien's displacement law.","The peak wavelength of the emitted radiation is inversely proportional to the absolute temperature: λ_max T = constant (2.898 × 10⁻³ m K)."],
  ["State the Stefan–Boltzmann law.","The luminosity of a black body is proportional to the surface area and the fourth power of surface temperature: L = 4πr²σT⁴."],
  ["State Hubble's law and what it suggests.","Recession speed is proportional to distance, v = H₀d; the universe is expanding, from an initial hot dense state."],
  ["Name three pieces of evidence for the Big Bang.","Hubble's law/galactic redshift; CMB radiation (2.7 K, uniform); the observed abundance of hydrogen and helium."],
  ["What is plotted on an HR diagram?","Luminosity (or absolute magnitude) against surface temperature (or spectral class), with temperature decreasing along the x-axis."],
  ["Define the light-year and the parsec.","Light-year: distance light travels in one year (9.46 × 10¹⁵ m). Parsec: distance at which one astronomical unit subtends an angle of one arcsecond (3.09 × 10¹⁶ m)."],
  ["Why do larger telescope diameters improve resolution?","Resolving power θ ≈ λ/D, so larger D gives a smaller angle that can be resolved. Larger D also collects more light."]],
 qs:[
  {m:4,cw:"Calculate",q:"A star has a surface temperature of 12 000 K and a radius of 3.0 × 10⁹ m. Calculate its luminosity and the wavelength at which it emits most strongly. (σ = 5.67 × 10⁻⁸ W m⁻² K⁻⁴)",
   ms:["L = 4πr²σT⁴","= 4π × (3.0 × 10⁹)² × 5.67 × 10⁻⁸ × (12000)⁴ = 1.3 × 10²⁹ W","λ_max = 2.898 × 10⁻³ / 12000","= 2.4 × 10⁻⁷ m (ultraviolet)"],tip:"Use the surface temperature in kelvin."},
  {m:5,cw:"Calculate",q:"The hydrogen-alpha line has a wavelength of 656.3 nm in the laboratory. In the light from a distant galaxy it is observed at 662.9 nm. Calculate (i) the recession speed of the galaxy, (ii) its distance using H₀ = 2.2 × 10⁻¹⁸ s⁻¹ and (iii) the age of the universe implied by H₀ in years.",
   ms:["Δλ = 6.6 nm","v = cΔλ/λ = 3.00 × 10⁸ × 6.6 / 656.3 = 3.0 × 10⁶ m s⁻¹","d = v/H₀ = 3.0 × 10⁶ / 2.2 × 10⁻¹⁸ = 1.4 × 10²⁴ m","Age ≈ 1/H₀ = 4.5 × 10¹⁷ s","= 1.4 × 10¹⁰ years"],tip:"Divide seconds by 3.16 × 10⁷ to convert to years."},
  {m:4,cw:"Identify",q:"The Hertzsprung–Russell diagram shows regions X, Y and Z. Identify each region, state where the Sun lies, and describe how a star of the Sun's mass will move around the diagram during its life.",fig:["hr"],
   ms:["X: red giants/supergiants (cool but very luminous, large radius)","Y: white dwarfs (hot but dim, small radius)","Z: main sequence, with the Sun lying in it","Sun leaves the main sequence to become a red giant, then a white dwarf (via a planetary nebula)"],tip:"L = 4πr²σT⁴ explains why cool stars can be luminous."}]});
T("cap",6,"6.1","Capacitors",{
 pts:["Capacitance C = Q/V; capacitors in series and parallel.","Energy stored: area under a V–Q graph; W = ½QV = ½CV².","Charging and discharging through a resistor; exponential decay; time constant τ = RC."],
 eq:[["Capacitance","C = Q/V"],["Energy stored","W = ½QV = ½CV² = ½Q²/C"],["Series","1/C = 1/C₁ + 1/C₂ + …"],["Parallel","C = C₁ + C₂ + …"],["Discharge","Q = Q₀e^(−t/RC) (same form for V and I)"],["Time constant","τ = RC ; t½ = RC ln2"]],
 tips:["Capacitor combinations are the reverse of resistor combinations.","For ln graphs: ln V = ln V₀ − t/RC gives a straight line of gradient −1/RC."],
 cards:[
  ["Define capacitance.","Charge stored per unit potential difference across the capacitor: C = Q/V. Unit: farad (F = C V⁻¹)."],
  ["Define the time constant of a discharging capacitor.","τ = RC: the time for the charge (or p.d. or current) to fall to 1/e (about 37%) of its initial value."],
  ["Why does the current in a discharging capacitor decrease exponentially?","As charge flows the p.d. falls, so current (V/R) falls; the rate of decrease is proportional to the amount remaining."],
  ["What does the area under a V–Q graph represent?","The energy stored on the capacitor."],
  ["How do you find the time for the p.d. to halve?","t½ = RC ln 2 = 0.69 RC."]],
 qs:[
  {m:5,cw:"Calculate",q:"A 470 μF capacitor is charged to 12 V and then discharged through a 22 kΩ resistor. Calculate (i) the energy initially stored, (ii) the time constant and (iii) the p.d. 20 s after the discharge begins.",
   ms:["E = ½CV² = ½ × 470 × 10⁻⁶ × 12²","= 0.034 J","τ = RC = 22 × 10³ × 470 × 10⁻⁶ = 10 s","V = V₀e^(−t/RC) = 12e^(−20/10.3)","= 1.7 V"],tip:"Keep the exponent unrounded."},
  {m:4,cw:"Determine",q:"The graph shows how the p.d. across a capacitor changes as it discharges through a resistor. Determine the time constant from the graph and describe how a straight-line graph could be used to find the time constant.",fig:["capdis",{v0:8,tau:5}],
   ms:["Read V₀ = 8.0 V and find the time when V = V₀/e = 2.9 V","τ ≈ 5.0 s","Plot ln V against t","Straight line with gradient −1/RC = −1/τ"],tip:"Mark the reading on the graph to show your method."}]});

T("efld",6,"6.2","Electric fields",{
 pts:["Electric field strength E = F/Q; field lines.","Coulomb's law and the field of a point charge.","Uniform field between parallel plates, E = V/d; motion of charged particles.","Electric potential and potential energy; comparison with gravitational fields."],
 eq:[["Field strength","E = F/Q"],["Coulomb's law","F = Qq/(4πε₀r²)"],["Point charge field","E = Q/(4πε₀r²)"],["Uniform field","E = V/d"],["Potential","V = Q/(4πε₀r)"]],
 tips:["1/(4πε₀) = 8.99 × 10⁹ N m² C⁻².","Use signs of charge to decide attraction or repulsion; the formula magnitude is positive."],
 cards:[
  ["Define electric field strength.","Force per unit positive charge placed at that point: E = F/Q."],
  ["Compare electric and gravitational fields.","Both are inverse-square (radial) fields. Gravity is always attractive and depends on mass; electric forces may attract or repel and depend on charge. The electric force between charged particles is far larger."],
  ["Describe the path of a charged particle entering a uniform electric field perpendicular to the field.","A parabola (constant force perpendicular to initial velocity, as for a projectile)."],
  ["What do the gradient of a V–r graph and the area under an E–r graph give?","Gradient of V–r = −E. Area under E–r = −ΔV."],
  ["What is the direction of the electric field lines?","In the direction a positive charge would move: away from positive charges, towards negative."]],
 qs:[
  {m:4,cw:"Calculate",q:"Two horizontal parallel plates 5.0 cm apart have a potential difference of 2.0 kV across them. An electron is between them. Calculate (i) the electric field strength, (ii) the force on the electron and (iii) its acceleration.",fig:["platefield"],
   ms:["E = V/d = 2000 / 0.050 = 4.0 × 10⁴ V m⁻¹","F = eE = 1.60 × 10⁻¹⁹ × 4.0 × 10⁴","= 6.4 × 10⁻¹⁵ N","a = F/m = 6.4 × 10⁻¹⁵ / 9.11 × 10⁻³¹ = 7.0 × 10¹⁵ m s⁻²"],tip:"Weight is negligible compared with the electric force."},
  {m:3,cw:"Calculate",q:"Two small spheres carry charges of +3.0 nC and +5.0 nC and are 0.10 m apart in a vacuum. Calculate the electrostatic force between them and state whether it is attractive or repulsive.",
   ms:["F = Qq/(4πε₀r²) with Q, q in coulombs","= 8.99 × 10⁹ × 3.0 × 10⁻⁹ × 5.0 × 10⁻⁹ / (0.10)² = 1.4 × 10⁻⁵ N","Repulsive (like charges)"],tip:"nC = 10⁻⁹ C."}]});

T("emag",6,"6.3","Electromagnetism",{
 pts:["Magnetic flux density; force on a current-carrying wire and a moving charge.","Circular motion of charged particles in a magnetic field.","Magnetic flux and flux linkage; Faraday's and Lenz's laws.","Alternating currents, transformers and power transmission."],
 eq:[["Force on wire","F = BIL sinθ"],["Force on charge","F = Bqv sinθ"],["Radius in B","r = mv/(Bq) = p/(Bq)"],["Flux","Φ = BA cosθ ; flux linkage = NΦ"],["Faraday","ε = −N ΔΦ/Δt"],["Transformer","V_s/V_p = N_s/N_p"]],
 tips:["Fleming's left hand rule for the force direction. Force on a charge: use conventional current direction (opposite for electrons).","The negative sign in Faraday's law is Lenz's law."],
 cards:[
  ["State Faraday's law.","The induced emf is directly proportional to the rate of change of magnetic flux linkage."],
  ["State Lenz's law and explain why it follows from conservation of energy.","The induced emf acts in a direction to oppose the change that produced it; otherwise energy could be created from nothing."],
  ["Why are cables used at high voltage for power transmission?","For the same power P = VI, higher V gives smaller current so less power is lost as heat (I²R) in the cables."],
  ["Why does a charged particle follow a circular path in a uniform magnetic field?","The force is perpendicular to the velocity, so it provides a centripetal force and does no work; the speed is constant."],
  ["Define the tesla.","The magnetic flux density that produces a force of 1 N on a 1 m wire carrying 1 A perpendicular to the field."],
  ["Why is a transformer core laminated and made of soft iron?","Soft iron is easily magnetised and demagnetised (low hysteresis loss); laminations reduce eddy currents and heating."]],
 qs:[
  {m:4,cw:"Calculate",q:"A proton is accelerated from rest through a potential difference of 2.0 kV and enters a uniform magnetic field of flux density 0.050 T perpendicular to its velocity. Calculate the radius of its path.",fig:["bfield"],
   ms:["eV = ½mv² so v = √(2eV/m)","v = √(2 × 1.60 × 10⁻¹⁹ × 2000 / 1.67 × 10⁻²⁷) = 6.2 × 10⁵ m s⁻¹","Bqv = mv²/r so r = mv/(Bq)","r = 0.13 m"],tip:"Equate the magnetic force to the centripetal force."},
  {m:4,cw:"Calculate",q:"A transformer reduces 230 V mains to 12 V. The primary coil has 1150 turns. (i) Calculate the number of turns on the secondary. (ii) The secondary delivers 36 W and the transformer is 92% efficient. Calculate the primary current.",
   ms:["N_s = N_p × V_s/V_p = 1150 × 12/230","= 60 turns","Input power = 36 / 0.92 = 39 W","I_p = P/V = 39 / 230 = 0.17 A"],tip:"Efficiency = output power ÷ input power."},
  {m:3,cw:"Calculate",q:"A coil of 200 turns and area 4.0 × 10⁻³ m² is perpendicular to a uniform magnetic field of 0.50 T. The field falls uniformly to zero in 0.10 s. Calculate the magnitude of the induced emf.",
   ms:["Change in flux linkage = NBA = 200 × 0.50 × 4.0 × 10⁻³ = 0.40 Wb turns","emf = ΔNΦ/Δt = 0.40 / 0.10","= 4.0 V"],tip:"Include N in the flux linkage."}]});

T("part",6,"6.4a","Particles: the nucleus, quarks and leptons",{
 pts:["Rutherford scattering and the structure of the atom; isotopes; nuclear notation.","Strong nuclear force (range, attractive and repulsive).","Hadrons (baryons, mesons) and leptons; quarks and antiquarks; antiparticles.","Beta decay, the neutrino, conservation laws and the weak interaction; Feynman diagrams."],
 eq:[["Nuclear notation","ᴬ_Z X: A = nucleon number, Z = proton number"],["Proton","uud (charge +1)"],["Neutron","udd (charge 0)"],["β⁻ decay","n → p + e⁻ + ν̄ₑ"],["β⁺ decay","p → n + e⁺ + νₑ"]],
 tips:["Check charge, baryon number and lepton number are conserved in every equation.","Antineutrino with β⁻, neutrino with β⁺."],
 cards:[
  ["Give the quark composition of the proton and neutron, and quark charges.","Proton uud, neutron udd. Up has charge +2/3 e, down −1/3 e."],
  ["Distinguish hadrons and leptons.","Hadrons are made of quarks and feel the strong force (baryons: three quarks; mesons: quark–antiquark). Leptons (e.g. electron, neutrino) are fundamental and do not feel the strong force."],
  ["Write the equation for β⁻ decay and the quark-level change.","n → p + e⁻ + ν̄ₑ ; d → u + e⁻ + ν̄ₑ via the weak interaction."],
  ["Why was the neutrino proposed?","Beta particles have a continuous range of energies, so energy and momentum conservation required a third emitted particle."],
  ["Which quantities are conserved in all particle interactions?","Charge, baryon number, lepton number (and energy and momentum)."],
  ["What did Rutherford scattering show?","Most alpha particles pass straight through (atom mostly empty space); a few are deflected through large angles, a very few rebound (small, dense, positively charged nucleus)."]],
 qs:[

T("bind",6,"6.4c","Binding energy, fission and fusion",{
 pts:["Mass–energy equivalence ΔE = Δmc².","Mass defect and binding energy per nucleon; the binding-energy curve.","Fission and fusion: energy released and conditions needed.","Nuclear reactors: moderator, control rods, coolant."],
 eq:[["Mass–energy","E = mc²"],["Binding energy","E_B = Δmc²"],["Atomic mass unit","1 u = 1.66 × 10⁻²⁷ kg = 931.5 MeV/c²"]],
 tips:["Use nuclear masses (or subtract electron masses carefully if atomic masses are given).","Energy per nucleon is what you compare for stability."],
 cards:[
  ["Define mass defect and binding energy.","Mass defect: the difference between the mass of the separated nucleons and the mass of the nucleus. Binding energy: the energy equivalent of that mass (Δmc²), the energy needed to separate the nucleus into its nucleons."],
  ["Describe the shape of the binding energy per nucleon against nucleon number graph.","Rises steeply for light nuclei, peaks around iron-56 (about 8.8 MeV per nucleon), then declines gently for heavy nuclei."],
  ["Explain why fission and fusion both release energy.","Both processes produce nuclei with higher binding energy per nucleon (closer to the peak), so the total binding energy increases and the difference is released."],
  ["Why is fusion hard to achieve?","The nuclei repel electrostatically; very high temperature and pressure are needed so that nuclei can get close enough for the strong force to act."],
  ["Roles of moderator, control rods and coolant in a fission reactor?","Moderator slows neutrons so they can cause fission; control rods absorb neutrons to regulate the chain reaction; coolant removes thermal energy."]],
 qs:[
  {m:4,cw:"Calculate",q:"The nuclear mass of a helium-4 nucleus is 4.00151 u. The mass of a proton is 1.00728 u and of a neutron is 1.00867 u. Calculate the binding energy of the nucleus and the binding energy per nucleon in MeV. (1 u = 931.5 MeV)",
   ms:["Mass of separate nucleons = 2 × 1.00728 + 2 × 1.00867 = 4.03190 u","Mass defect = 4.03190 − 4.00151 = 0.03039 u","Binding energy = 0.03039 × 931.5 = 28.3 MeV","Per nucleon = 28.3 / 4 = 7.08 MeV"],tip:"Divide by A for the per-nucleon value."},
  {m:4,cw:"Explain",q:"The graph shows how the binding energy per nucleon varies with nucleon number. Use the graph to explain why energy is released in both nuclear fusion and nuclear fission.",fig:["bec"],
   ms:["Binding energy per nucleon increases from light nuclei up to a maximum near iron-56","In fusion light nuclei combine to form a nucleus with a higher binding energy per nucleon","In fission a heavy nucleus splits into two medium nuclei with a higher binding energy per nucleon","The increase in total binding energy (decrease in mass) is released as energy, E = Δmc²"],tip:"Name which side of the peak each process starts on."}]});

 pts:["X-ray production and attenuation I = I₀e^(−μx); contrast media.","CT scanning: rotating X-ray source and detectors, image reconstruction.","Gamma camera: radioactive tracers such as technetium-99m.","PET scanning: positron annihilation and detection of gamma pairs.","Ultrasound: pulse–echo, acoustic impedance and reflection.","MRI: strong magnetic fields, radio-frequency pulses and the detection of relaxation signals (qualitative)."],

 cards:[
  ["State the attenuation equation and what μ represents.","I = I₀e^(−μx). μ is the linear attenuation coefficient, larger for denser or higher-Z materials such as bone."],

  ["Outline how a CT scan produces an image.","An X-ray source and detectors rotate around the patient, taking many attenuation measurements from different angles; a computer reconstructs cross-sectional slices (which can be assembled into a 3D image)."]],
