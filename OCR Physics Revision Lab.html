const DEFS='<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="inkf"/></marker><marker id="ahA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="accf"/></marker></defs>';
function svg(W,H,inner,alt){return `<svg class="fig" viewBox="0 0 ${W} ${H}" role="img" aria-label="${alt||'Diagram'}">${DEFS}${inner}</svg>`}
const nf=v=>String(+(+v).toFixed(3));
function graph(o){
  const W=o.W||380,H=o.H||240,l=52,r=16,t=14,b=44;
  const X=v=>l+(v-o.x[0])/(o.x[1]-o.x[0])*(W-l-r), Y=v=>H-b-(v-o.y[0])/(o.y[1]-o.y[0])*(H-t-b);
  let s='';
  for(let v=o.x[0];v<=o.x[1]+1e-9;v+=o.x[2]){v=+v.toFixed(6);s+=`<line class="gr" x1="${X(v)}" y1="${t}" x2="${X(v)}" y2="${H-b}"/>`+(o.nox?'':`<text x="${X(v)}" y="${H-b+14}" text-anchor="middle" class="tk">${nf(v)}</text>`)}
  for(let v=o.y[0];v<=o.y[1]+1e-9;v+=o.y[2]){v=+v.toFixed(6);s+=`<line class="gr" x1="${l}" y1="${Y(v)}" x2="${W-r}" y2="${Y(v)}"/>`+(o.noy?'':`<text x="${l-6}" y="${Y(v)+4}" text-anchor="end" class="tk">${nf(v)}</text>`)}
  const x0=o.x[0]<0&&o.x[1]>0?X(0):l, y0=o.y[0]<0&&o.y[1]>0?Y(0):H-b;
  s+=`<path class="ax" d="M${x0} ${t} V${H-b}M${l} ${y0} H${W-r}"/>`;
  s+=`<text x="${(l+W-r)/2}" y="${H-6}" text-anchor="middle">${o.x[3]||''}</text>`;
  s+=`<text transform="translate(12 ${(t+H-b)/2}) rotate(-90)" text-anchor="middle">${o.y[3]||''}</text>`;
  s+=o.body(X,Y);
  return svg(W,H,s,o.alt);
}
const pl=(pts,X,Y,cls)=>`<polyline class="${cls||'c1'}" points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}"/>`;
const curve=(f,a,b,n,X,Y,cls)=>{const p=[];for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;p.push([x,f(x)])}return pl(p,X,Y,cls)};
const tx=(x,y,t,a,c)=>`<text x="${x}" y="${y}" text-anchor="${a||'start'}" class="${c||''}">${t}</text>`;
const arrow=(x1,y1,x2,y2,cls)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="ink" marker-end="url(#ah)" ${cls?`style="${cls}"`:''}/>`;

const rnd=(a,b,st)=>{st=st||1;const n=Math.floor((b-a)/st);return +(a+st*Math.floor(Math.random()*(n+1))).toFixed(6)};

function sf(x,n){n=n||3;if(!isFinite(x)||x===0)return String(x);const e=Math.floor(Math.log10(Math.abs(x)));if(e>=5||e<=-3){const m=x/Math.pow(10,e);return (+m.toPrecision(n))+' × 10'+String(e).replace(/-/g,'⁻').replace(/\d/g,d=>'⁰¹²³⁴⁵⁶⁷⁸⁹'[d])}return String(+x.toPrecision(n))}

function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){canSave=false}}

/* ----- items ----- */
const ITEMS=[],BY={},TB={};
TOPICS.forEach(t=>{TB[t.id]=t;
  t.cards.forEach((c,i)=>{const it={id:t.id+'-c'+i,topic:t.id,type:'card',q:c[0],a:c[1]};ITEMS.push(it);BY[it.id]=it});
  t.qs.forEach((q,i)=>{const it=Object.assign({id:t.id+'-q'+i,topic:t.id,type:'q'},q);ITEMS.push(it);BY[it.id]=it})});
const itemsOf=id=>ITEMS.filter(i=>i.topic===id);
const tget=id=>S.topics[id]||{status:0,conf:0,note:''};
const tset=(id,p)=>{S.topics[id]=Object.assign({status:0,conf:0,note:''},S.topics[id],p);save()};

/* ----- scheduling (SM-2 style with exam-date cap) ----- */
function nextTestDays(topic){let best=null;for(const t of S.tests){if(!t.topics.includes(topic))continue;const d=diffDays(today(),t.date);if(d>=0&&(best===null||d<best))best=d}return best}
function examCap(topic){const d=nextTestDays(topic);if(d===null||d>60)return null;return Math.max(1,Math.floor((d-1)/2))}
function nextState(r0,g,topic){
  const r=Object.assign({ease:2.5,int:0,reps:0,lapses:0,n:0},r0||{});
  if(g===0){r.lapses++;r.reps=0;r.ease=Math.max(1.3,r.ease-.2);r.int=0}
  else{
    if(r.reps===0)r.int=g===3?4:1;
    else if(r.reps===1)r.int=g===1?2:g===2?3:6;
    else{const b=Math.max(1,r.int);r.int=Math.round(g===1?b*1.2:g===2?b*r.ease:b*r.ease*1.35);if(r.int<=b)r.int=b+1}
    r.reps++;if(g===1)r.ease=Math.max(1.3,r.ease-.15);if(g===3)r.ease+=.15;
    const cap=examCap(topic);if(cap!==null)r.int=Math.min(r.int,cap);
  }
  r.due=addDays(today(),r.int);r.last=today();r.n++;return r;
}
function retr(it){const r=S.sr[it.id];if(!r)return 0;const el=Math.max(0,diffDays(r.last,today()));return Math.pow(.9,el/Math.max(1,r.int))}
function mastery(id){
  const its=itemsOf(id),seen=its.filter(i=>S.sr[i.id]);const c=tget(id).conf/5;
  if(!seen.length)return c*.25;
  const avg=seen.reduce((a,i)=>a+retr(i),0)/seen.length,cov=seen.length/its.length;
  const ev=avg*Math.min(1,cov*1.4);
  return c?.7*ev+.3*c:ev;
}
const mcol=m=>m<.4?'bad':m<.65?'warn':'good';
const pct=x=>Math.round(x*100);
function readiness(test){const ts=test.topics;return ts.length?ts.reduce((a,t)=>a+mastery(t),0)/ts.length:0}

/* ----- queues ----- */
const dueItems=()=>{const t=today();return ITEMS.filter(i=>{const r=S.sr[i.id];return r&&r.due<=t})};
const urg=topic=>{const d=nextTestDays(topic);return d===null?999:d};
function interleave(list){
  const g={};list.forEach(i=>(g[i.topic]=g[i.topic]||[]).push(i));
  const keys=Object.keys(g);const out=[];let more=true;
  while(more){more=false;keys.forEach(k=>{if(g[k].length){out.push(g[k].shift());more=true}})}
  return out}
function smartQueue(){
  const t=today();
  const due=dueItems().sort((a,b)=>urg(a.topic)-urg(b.topic)||S.sr[a.id].due.localeCompare(S.sr[b.id].due)).slice(0,25);
  const left=Math.max(0,S.settings.newPerDay-((S.days[t]||{}).n||0));
  const nc=ITEMS.filter(i=>!S.sr[i.id]&&tget(i.topic).status>=1)
    .sort((a,b)=>urg(a.topic)-urg(b.topic)||mastery(a.topic)-mastery(b.topic)||(a.type==='card'?-1:1)-(b.type==='card'?-1:1)).slice(0,left);
  return interleave(due).concat(interleave(nc));
}
function estMin(q){return Math.max(1,Math.round(q.reduce((a,i)=>a+(i.type==='q'?i.m*1.35+.5:.7),0)))}
function streak(){let n=0,d=today();if(!(S.days[d]||{}).rev)d=addDays(d,-1);while((S.days[d]||{}).rev){n++;d=addDays(d,-1)}return n}

/* ----- study plan ----- */
function buildPlan(span){
  const t0=today();const up=S.tests.filter(x=>diffDays(t0,x.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  const map={};up.forEach(te=>te.topics.forEach(tp=>{if(!map[tp])map[tp]=te.date}));
  let L=Object.keys(map).map(id=>({id,date:map[id],m:mastery(id)})).sort((a,b)=>a.date.localeCompare(b.date)||a.m-b.m);
  if(!L.length){L=TOPICS.filter(x=>tget(x.id).status>=1).map(x=>({id:x.id,date:null,m:mastery(x.id)})).sort((a,b)=>a.m-b.m)}
  const W=[];[1,.6,.35].forEach((th,k)=>L.forEach(x=>{if(k===0||x.m<th)W.push(x)}));
  const days=[];let ptr=0;
  for(let i=0;i<span;i++){
    const d=addDays(t0,i);const tests=up.filter(x=>x.date===d);const tasks=[];
    const dueThen=ITEMS.filter(it=>{const r=S.sr[it.id];return r&&r.due<=d&&(i>0||true)}).length;
    if(i===0||dueThen)tasks.push({k:'rev',t:i===0?`Clear today's scheduled reviews (${dueItems().length} due)`:`Scheduled reviews (about ${dueThen} items by then)`});
    const left=x=>diffDays(d,x);
    const active=W.filter(x=>x.date===null||left(x.date)>=0);
    const nextT=up.find(x=>diffDays(d,x.date)>=0);
    const dt=nextT?diffDays(d,nextT.date):null;
    if(tests.length){tasks.push({k:'test',t:`Test day: ${tests.map(x=>esc(x.name)).join(', ')}. Skim your equation list, then trust your preparation.`})}
    else if(dt===1)tasks.push({k:'light',t:`Light retrieval only: flashcards on ${esc(nextT.name)} topics. Stop early and sleep well.`});
    else if(dt===2)tasks.push({k:'fix',t:`Fix the gaps from your mini-paper: redo missed mark points for ${esc(nextT.name)}.`});
    else if(dt===3)tasks.push({k:'paper',t:`Timed mini-paper (exam practice) on ${esc(nextT.name)} topics.`});
    else if(active.length){
      const pickd=[];let guard=0;
      while(pickd.length<Math.min(2,new Set(active.map(x=>x.id)).size)&&guard++<20){const c=active[ptr%active.length];ptr++;if(!pickd.find(p=>p.id===c.id))pickd.push(c)}
      pickd.forEach(c=>{const tp=TB[c.id],st=tget(c.id).status;
        tasks.push(st===0?{k:'learn',t:`Learn and write notes: ${tp.ref} ${tp.title}`,id:c.id}
          :c.m<.5?{k:'weak',t:`Retrieval and exam questions: ${tp.ref} ${tp.title} (needs work)`,id:c.id}
          :{k:'mix',t:`Mixed retrieval: ${tp.ref} ${tp.title}`,id:c.id})});
    }
    days.push({d,tasks,tests});
  }
  return days;
}

function rankFor(list){return list.sort((a,b)=>{const ra=S.sr[a.id]?retr(a):-1,rb=S.sr[b.id]?retr(b):-1;return ra-rb||Math.random()-.5})}
function shuf(a){return a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1])}

/* ----- Session UI ----- */
function tickTimer(){const s=UI.sess;if(!s||s.kind!=='exam'){clearInterval(UI.tm);return}const el=$('#timer');if(!el)return;const left=s.limit-(Date.now()-s.t0)/1000;const a=Math.abs(left),m=Math.floor(a/60),sec=Math.floor(a%60);el.textContent=(left<0?'+':'')+pad(m)+':'+pad(sec);el.className='timer '+(left<0?'over':'')}
function sessHead(s){

function vSession(){
  const s=UI.sess;if(s.i>=s.queue.length)return vSummary();

  let h=`<div class="sess">${sessHead(s)}<div class="card sess-card"><div class="row" style="gap:6px"><span class="chip acc">${tp.ref} ${esc(tp.title.split(' and ')[0])}</span>`;
  if(it.type==='q')h+=`<span class="chip">${it.m} mark${it.m>1?'s':''}</span><span class="chip">${it.cw}</span>`;
  if(it.type==='card')h+=`<span class="chip">Flashcard</span>`;
  if(it.type==='calc')h+=`<span class="chip">Calculation</span>`;

    h+=`<p class="qtext">${it.q}</p>`;

  }else if(it.type==='q'){
    h+=`<p class="qtext">${it.q}</p>${figHTML(it.fig)}`;
    if(s.step==='ask')h+=`<textarea id="ans" placeholder="Write your answer and working here (on paper is fine too), then reveal the mark scheme."></textarea><div class="row"><button class="btn" data-act="show">Reveal mark scheme</button><span class="note">About ${Math.max(1,Math.round(it.m*1.35))} min in the exam.</span></div>`;
    else h+=`<textarea readonly style="min-height:70px">${esc(s.draft)}</textarea><h4>Mark scheme: tick only the points you really made</h4><ul class="ms">${it.ms.map((p,i)=>`<li><label><input type="checkbox" data-chg="mp" value="${i}"><span>${p}</span></label></li>`).join('')}</ul>${it.tip?`<div class="pit"><b>Examiner tip.</b> ${it.tip}</div>`:''}<div class="row"><button class="btn" data-act="submitq" id="sq">Save ${0}/${it.m}</button></div>`;
  }else{
    h+=`<p class="qtext">${it.q}</p>`;
    if(s.step==='ask')h+=`<div class="row" style="flex-wrap:nowrap"><input type="text" id="cin" inputmode="decimal" autocomplete="off" placeholder="Answer, e.g. 12.5 or 3.2e-5" aria-label="Your answer"><span class="mono">${it.u}</span></div><div class="row"><button class="btn" data-act="check">Check</button><button class="btn ghost" data-act="giveup">Show solution</button></div><p class="note">Accepted if within 2% of the exact answer. Use e-notation for powers of ten.</p>`;
    else h+=`<div class="chip ${s.ok?'good':'bad'}" style="align-self:flex-start">${s.ok?'Correct':'Not quite'}${s.given!=null&&!isNaN(s.given)?` · you entered ${sf(s.given)}`:''}</div><div class="answer"><b>${sf(it.a)} ${it.u}</b><div class="small" style="margin-top:6px">${it.sol}</div></div><button class="btn" data-act="nextcalc">Next</button>`;

function gradeBtns(it){
  const r=S.sr[it.id],early=r&&r.due>today();
  const L=['Again','Hard','Good','Easy'];
  return `<div class="grades">${L.map((l,g)=>{const n=nextState(r,g,it.topic);return `<button data-act="grade" data-v="${g}">${l}<small>${early&&g>0?'no change':fmtInt(n.int)}</small><small>${g+1}</small></button>`}).join('')}</div>`;
}
function record(it,g,score,extra){
  const t=today();const day=S.days[t]||(S.days[t]={n:0,rev:0});
  const r=S.sr[it.id],early=r&&r.due>t;
  if(!r)day.n=(day.n||0)+1;
  if(!early||g===0)S.sr[it.id]=nextState(r,g,it.topic);
  day.rev=(day.rev||0)+1;
  S.log.push(Object.assign({d:t,i:it.id,tp:it.topic,ty:it.type,s:score,g},extra||{}));
  if(S.log.length>3000)S.log=S.log.slice(-3000);
  save();
}

function examTable(){
  const by={};S.log.filter(l=>l.ty==='q'&&l.tot).forEach(l=>{const b=by[l.tp]||(by[l.tp]={g:0,t:0});b.g+=l.got;b.t+=l.tot});

function forecast(){
  const t=today();const a=[];let max=1;
  for(let i=0;i<14;i++){const d=addDays(t,i);const n=ITEMS.filter(it=>{const r=S.sr[it.id];return r&&(i===0?r.due<=d:r.due===d)}).length;max=Math.max(max,n);a.push([d,n])}
  return `<div class="fc" style="margin-top:12px">${a.map(([d,n])=>`<div title="${fmtDate(d)}: ${n} due"><span>${n||''}</span><i style="height:${Math.max(2,n/max*60)}px;${n?'':'opacity:.25'}"></i><span>${parseD(d).getDate()}</span></div>`).join('')}</div>`;
}
function heat(){
  const t=today();const start=addDays(t,-(12*7-1)-parseD(t).getDay());let max=1;const cells=[];
  for(let i=0;i<13*7;i++){const d=addDays(start,i);if(d>t){cells.push(null);continue}const n=(S.days[d]||{}).rev||0;max=Math.max(max,n);cells.push([d,n])}
  return `<div class="heat">${cells.map(c=>c?`<i title="${fmtDate(c[0])}: ${c[1]} reviews">${c[1]?`<b style="opacity:${.25+.75*c[1]/max}"></b>`:''}</i>`:'<i style="visibility:hidden"></i>').join('')}</div>`;
}

function parseNum(s){
  s=String(s).trim().replace(/[−–]/g,'-').replace(/\s+/g,'').replace(/(?:×|x|\*)10\^?(-?\d+)/i,'e$1').replace(/,/g,'');
  const v=Number(s);return s===''?NaN:v;
}
function buildDrill(topics,type,n){
  let pool=ITEMS.filter(i=>topics.includes(i.topic)&&(type==='all'||i.type===type));
  return interleave(rankFor(pool).slice(0,n));
}
function buildExam(topics,marks){
  const pool=rankFor(ITEMS.filter(i=>i.type==='q'&&topics.includes(i.topic)));
  const out=[];let got=0;for(const q of pool){if(got>=marks)break;out.push(q);got+=q.m}
  return {queue:shuf(out),total:got};
}
function recordCalc(it,ok){
  const t=today();const day=S.days[t]||(S.days[t]={n:0,rev:0});day.rev=(day.rev||0)+1;
  const c=S.calc[it.topic]||(S.calc[it.topic]={n:0,ok:0});c.n++;if(ok)c.ok++;
  S.log.push({d:t,i:'calc-'+it.topic,tp:it.topic,ty:'calc',s:ok?1:0,g:ok?2:0});if(S.log.length>3000)S.log=S.log.slice(-3000);save();
}

  show(){const s=UI.sess,it=s.queue[s.i];if(it.type==='q'){const a=$('#ans');s.draft=a?a.value:''}s.step='reveal';render();
    if(it.type==='q')updMarks()},
  grade(b){const s=UI.sess,it=s.queue[s.i],g=+b.dataset.v,sc=[0,.4,.8,1][g];record(it,g,sc);s.res.push({topic:it.topic,s:sc,id:it.id});reQueue(it,g);advance()},
  submitq(){const s=UI.sess,it=s.queue[s.i];const checked=$$('.ms input:checked').map(c=>+c.value);const got=checked.length,sc=got/it.m;
    const g=sc<.4?0:sc<.7?1:sc<.9?2:3;const missed=it.ms.filter((p,i)=>!checked.includes(i));
    record(it,g,sc,{got,tot:it.m});s.res.push({topic:it.topic,s:sc,got,tot:it.m,missed:s.kind==='exam'||got<it.m?missed:[]});reQueue(it,g);advance()},
  check(){const s=UI.sess,it=s.queue[s.i];const v=parseNum($('#cin').value);if(isNaN(v)){$('#cin').focus();return}
    const ok=Math.abs(v-it.a)<=Math.abs(it.a)*.02+1e-15;s.ok=ok;s.given=v;s.step='reveal';recordCalc(it,ok);s.res.push({topic:it.topic,s:ok?1:0});render()},
  giveup(){const s=UI.sess,it=s.queue[s.i];s.ok=false;s.given=null;s.step='reveal';recordCalc(it,false);s.res.push({topic:it.topic,s:0});render()},
  nextcalc(){advance()},
  exit(){const s=UI.sess;if(s.res.length){s.i=s.queue.length;render()}else{UI.sess=null;clearInterval(UI.tm);render()}},
  done(){UI.sess=null;UI.tab='today';clearInterval(UI.tm);window.scrollTo(0,0);render()},
  export(){const t=$('#bk');t.value=JSON.stringify(S);t.select();$('#bmsg').textContent='Backup ready. Copy it somewhere safe.'},
  copy(){const t=$('#bk');if(!t.value)ACT.export();t.select();
    const done=()=>{$('#bmsg').textContent='Copied.'};
    try{navigator.clipboard.writeText(t.value).then(done,()=>{$('#bmsg').textContent='Press Ctrl or Cmd + C to copy.'})}catch(e){$('#bmsg').textContent='Press Ctrl or Cmd + C to copy.'}},
  import(){try{const o=JSON.parse($('#bk').value);if(!o||typeof o!=='object'||!o.sr||!o.topics)throw 0;S=Object.assign(fresh(),o);S.settings=Object.assign(fresh().settings,S.settings);save();UI.sel=null;render()}catch(e){$('#bmsg').textContent='That text is not a valid backup.'}},
  reset(){if(UI.confirm==='reset'){S=fresh();save();UI.confirm=null;UI.sel=null;UI.open={};render()}else{UI.confirm='reset';render()}}
};
function updMarks(){const s=UI.sess,it=s.queue[s.i],k=$$('.ms input:checked').length,b=$('#sq');if(b)b.textContent=`Save ${k}/${it.m}`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b)}});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.chg;if(!c)return;
  if(c==='note')tset(e.target.dataset.id,{note:e.target.value});
  else if(c==='pick'){if(e.target.checked)UI.sel.add(e.target.value);else UI.sel.delete(e.target.value);const el=$('#selcount');if(el)el.textContent=UI.sel.size+' selected'}
  else if(c==='mp')updMarks();
  else if(c==='setnew'){S.settings.newPerDay=+e.target.value;save()}
  else if(c==='settg'){S.settings.target=e.target.value;save()}
});
document.addEventListener('keydown',e=>{
  const s=UI.sess;const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'&&e.target.id==='cin'){e.preventDefault();ACT.check();return}
  if(!s||s.i>=s.queue.length||tag==='textarea'||tag==='input'||tag==='select')return;
  const it=s.queue[s.i];if(it.type!=='card')return;
  if(s.step==='ask'&&(e.key===' '||e.key==='Enter')){e.preventDefault();ACT.show()}
  else if(s.step==='reveal'&&'1234'.includes(e.key)&&e.key.length===1)ACT.grade({dataset:{v:String(+e.key-1)}});
});
render();
</script>

</body></html>
